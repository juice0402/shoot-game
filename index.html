<title>シューティング×ヴァンサヴァ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* Layout: one phone screen. Hangar = header / ship bay (fills) / selected-slot bar / module tray (scrolls sideways) / launch. Shop = full-screen panel: tabs, item grid, detail + buy. Sortie = HUD strip + pixel canvas. Single dark look on purpose (space game). */
:root{
  --void:#0a0b1c; --deep:#05060f; --panel:#14163a; --panel-2:#1d2052; --edge:#2e3277;
  --ink:#eceaff; --dim:#9498d0; --scrim:rgba(5,6,15,.9);
  --go:#ffd23f; --go-ink:#2b1d00; --go-sh:#a7791a; --hurt:#ff2d6f;
  --f-ui:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Press Start 2P","DotGothic16",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #4cc9ff;outline-offset:2px}
button:disabled{cursor:not-allowed}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- title・遊び方 ---------- */
#title{position:fixed;inset:0;z-index:30;background:var(--deep);overflow:hidden}
#titleCv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}
.tbox{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(14vh + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.logo{margin:0;text-align:center;font-family:var(--f-num);font-weight:400;font-size:clamp(30px,10vw,46px);line-height:1.25;letter-spacing:.04em;color:#fff2a8;
  text-shadow:0 3px 0 #b8600e,0 6px 0 #6e3006,0 0 18px rgba(255,205,72,.55)}
.logo small{display:block;margin-top:14px;font-family:var(--f-ui);font-size:15px;letter-spacing:.12em;color:#cfeaff;text-shadow:0 2px 0 #060a1c}
.tbtns{display:flex;flex-direction:column;gap:10px}
.tbtns .hrow button{flex:1}
.btn3.sq{width:44px;min-height:44px;padding:0;flex:none}
.howbg{position:fixed;inset:0;z-index:70;background:rgba(5,6,15,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.howbox{width:100%;max-width:400px;background:var(--panel);border:3px solid var(--go);padding:14px;display:flex;flex-direction:column;gap:12px}
.howcard{display:flex;flex-direction:column;gap:8px;text-align:center}
.howcard h3{margin:0;font-weight:400;font-size:20px;color:var(--go)}
.howcard p{margin:0;font-size:15px;line-height:1.6}
.howno{color:var(--dim);font-size:14px!important}
.howart{width:100%;aspect-ratio:160/110;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--edge)}
.howdots{display:flex;justify-content:center;gap:8px}
.howdots i{width:9px;height:9px;background:var(--edge)}
.howdots i.on{background:var(--go)}
.howbox .hrow button:first-child{flex:none;width:30%}

/* ---------- hangar（スマホ1画面：上＝お金とショップ／まんなか＝大きな機体／下＝出撃） ---------- */
#hangar{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:22px;line-height:1.2;font-weight:400;letter-spacing:.08em}
h1 small{font-size:14px;color:var(--dim);letter-spacing:.04em;margin-left:6px}
@media (max-width:430px){h1 small{display:none}}
.gold{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--panel);border:3px solid var(--edge);flex:none}
.coin{width:16px;height:16px;image-rendering:pixelated;image-rendering:crisp-edges}
.gold b{font-size:14px;font-weight:400}
.gold small{color:var(--dim);font-size:14px}
.shopbtn{position:relative;flex:none;height:44px;padding:0 14px;background:var(--panel);border:3px solid var(--go);color:var(--go);font-size:16px}
.badge{position:absolute;top:-7px;right:-7px;width:14px;height:14px;background:var(--hurt);border:2px solid var(--void);border-radius:50%}
.bay{flex:1;min-height:250px;position:relative;background:var(--deep);border:3px solid var(--edge);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#editor{position:absolute;inset:0;width:100%;height:100%;display:block}
.shipcap{position:absolute;left:52px;right:52px;top:6px;margin:0;text-align:center;pointer-events:none;line-height:1.3}
.shipcap b{display:block;font-size:20px;font-weight:400;letter-spacing:.06em}
.shipcap small{display:block;font-size:14px;color:var(--dim)}
.navb{position:absolute;top:50%;z-index:3;width:44px;height:72px;margin-top:-36px;background:rgba(20,22,58,.88);border:3px solid var(--edge);font-size:18px}
#shipPrev{left:4px}#shipNext{right:4px}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;pointer-events:none}
.dots i{width:9px;height:9px;background:var(--edge)}
.dots i.on{background:var(--ink)}
.slots{position:absolute;inset:0;z-index:2;pointer-events:none}
.slotb{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:transparent;border:0;pointer-events:auto;padding:0}
.slotb.empty{border:3px dashed #8fd0ff;background:rgba(10,30,70,.55);color:#cfeaff;font-size:24px;line-height:1;animation:plus 1.2s ease-in-out infinite}
.slotb.full:active{background:rgba(255,255,255,.15)}
@keyframes plus{50%{box-shadow:0 0 0 4px rgba(90,170,255,.35),0 0 16px 4px rgba(90,170,255,.55);border-color:#ffffff}}
.lockbox{position:absolute;left:52px;right:52px;bottom:26px;z-index:3;background:var(--scrim);border:3px solid var(--edge);padding:8px 10px;text-align:center;font-size:14px;line-height:1.4}
.lockbox p{margin:0}
.prog{height:12px;background:var(--panel);border:2px solid var(--edge);margin:6px 0}
.prog i{display:block;height:100%;background:var(--go)}
.lockbox .btn3{margin-top:6px;width:100%}
.finger{position:absolute;z-index:4;translate:-50% 0;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:tap 1s ease-in-out infinite}
.finger span{font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 #000)}
.finger b{font-weight:400;font-size:14px;background:var(--go);color:var(--go-ink);padding:2px 8px;white-space:nowrap}
@keyframes tap{50%{transform:translateY(6px)}}
.toast{position:absolute;left:8px;right:8px;bottom:26px;z-index:5;margin:0 auto;width:max-content;max-width:calc(100% - 16px);padding:4px 10px;background:var(--scrim);border:2px solid var(--go);color:var(--go);font-size:14px;text-align:center;pointer-events:none}
.hrow{display:flex;gap:8px}
.btn3{min-height:48px;padding:0 14px;background:var(--panel-2);border:3px solid var(--edge);font-size:15px}
.go{flex:1;display:block;width:100%;min-height:58px;padding:10px;font-size:21px;letter-spacing:.2em;background:var(--go);color:var(--go-ink);border:0;box-shadow:inset 0 -5px 0 var(--go-sh),inset 0 3px 0 rgba(255,255,255,.45)}
.go:active{transform:translateY(2px);box-shadow:inset 0 -3px 0 var(--go-sh)}
.go:disabled{background:var(--panel-2);color:var(--dim);box-shadow:none;letter-spacing:.04em;font-size:16px}

/* 下から出る板（装備の一覧・向き・くわしく・ショップのくわしく） */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(5,6,15,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;max-height:82%;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:3px solid var(--c,var(--edge));border-bottom:0;
  padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .16s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:0;font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px;min-height:44px}
.sheet h3 small{font-size:14px;color:var(--dim)}
.sheet .x{margin-left:auto;flex:none;width:44px;height:44px;background:var(--panel-2);border:3px solid var(--edge);font-size:18px}
.sheet p{margin:0;font-size:14px;line-height:1.5}
.sheet .dim{color:var(--dim)}
.irow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;min-height:62px;padding:6px 10px;background:var(--panel-2);border:3px solid var(--edge);border-left:8px solid var(--c);text-align:left;width:100%}
.irow img{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges}
.irow b{display:block;font-size:16px;font-weight:400;line-height:1.3}
.irow small{display:block;font-size:14px;color:var(--dim);line-height:1.35}
.irow em{font-style:normal;font-size:14px;color:var(--ink);white-space:nowrap}
.irow:disabled{opacity:.45}
.irow.now{border-color:var(--go)}
.dirs{display:grid;grid-template-columns:repeat(3,68px);grid-auto-rows:68px;gap:8px;justify-content:center}
.dirs button{font-size:28px;background:var(--panel-2);border:3px solid var(--edge)}
.dirs button[aria-pressed="true"]{border-color:var(--go);color:var(--go);background:#2a2a5a}
.dirs .mid{display:grid;place-items:center;background:var(--deep);border:3px solid var(--edge)}
.dirs .mid img{width:56px;height:56px;image-rendering:pixelated;image-rendering:crisp-edges}
.sbtns{display:flex;gap:8px}
.sbtns button{flex:1}
.btn3.warn{border-color:var(--hurt);color:#ffb0c4}
.statl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.statl li{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;background:var(--panel-2);font-size:14px}
.statl li b{font-weight:400;color:var(--go)}

/* ---------- shop（2列の大きなカード → タップでくわしく） ---------- */
.shopx{position:fixed;inset:0;z-index:40;background:var(--void);display:flex;flex-direction:column;gap:8px;
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shopx>*{width:100%;max-width:460px;margin-inline:auto}
.shead{display:flex;align-items:center;gap:8px;min-height:44px}
.shead h2{flex:1;margin:0;font-weight:400;font-size:22px;letter-spacing:.08em}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stabs button{position:relative;min-height:46px;background:var(--panel);border:3px solid var(--edge);font-size:16px}
.stabs button[aria-selected="true"]{border-color:var(--go);color:var(--go);background:var(--panel-2)}
.sgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;padding:2px;overscroll-behavior:contain}
.sitem{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:138px;padding:10px 6px;background:var(--panel);border:3px solid var(--edge);border-bottom:6px solid var(--c);min-width:0}
.sitem img{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain}
.sitem span{font-size:15px;line-height:1.3;text-align:center;max-width:100%}
.sitem small{font-size:14px;color:var(--go);line-height:1.3}
.sitem small.short{color:var(--dim)}
.sitem i{position:absolute;top:4px;right:4px;font-style:normal;font-size:14px;line-height:1;color:var(--ink);background:var(--edge);padding:4px 6px}
.sitem.can::after{content:"";position:absolute;top:6px;left:6px;width:10px;height:10px;background:var(--go);border-radius:50%}
.dtop{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.dtop img{width:76px;height:76px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain;background:var(--deep);border:3px solid var(--c)}
.dtop b{font-weight:400;font-size:19px;line-height:1.3}
.cat{display:inline-block;margin-left:8px;padding:0 6px;font-size:14px;background:var(--c);color:var(--deep);vertical-align:2px}
.dtop p{margin:4px 0 0;font-size:14px;color:var(--dim);line-height:1.5}
.drate{display:flex;flex-direction:column;gap:6px;font-size:14px}
.rt{display:grid;grid-template-columns:3.5em 1fr;align-items:center;gap:8px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.bars i{height:12px;background:var(--edge)}
.bars i.on{background:var(--c)}
.eff{margin:0;font-size:15px}
.eff span{color:var(--dim)}
.own{font-size:14px;color:var(--dim)}
.own b{font-weight:400;color:var(--ink)}
.buybig{width:100%;min-height:56px;padding:10px 14px;font-size:18px;background:var(--go);color:var(--go-ink);border:0;box-shadow:inset 0 -5px 0 var(--go-sh)}
.buybig:disabled{background:var(--panel-2);color:var(--dim);box-shadow:none;font-size:16px}
.snote{margin:0;min-height:1.4em;font-size:14px;color:var(--go);text-align:center}
.linkbtn{background:none;border:2px dashed var(--edge);color:var(--dim);min-height:44px;width:100%;font-size:14px}
.btn2{min-height:48px;padding:12px;background:var(--panel);border:3px solid var(--edge);font-size:15px}
.btn2.small{min-height:44px;padding:4px 12px;font-size:15px}

/* ---------- sortie ---------- */
#sortie{height:100%;display:flex;flex-direction:column;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{display:flex;flex-direction:column;gap:6px;padding-block:8px 6px}
.xpbar{height:8px;background:var(--panel);border:2px solid var(--edge)}
.xpbar i{display:block;height:100%;width:0;background:#5aa2ff}
.hudrow{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;font-size:13px}
#hudLv{font-size:10px}
.clock{text-align:center;white-space:nowrap}
.clock b{font-size:14px;font-weight:400}
.clock small{font-size:8px;color:var(--dim);margin-left:4px}
.kills{text-align:right;white-space:nowrap}
.kills b{font-family:var(--f-num);font-size:10px;font-weight:400}
#pauseBtn{width:42px;height:34px;background:var(--panel);border:3px solid var(--edge);display:flex;gap:4px;align-items:center;justify-content:center}
#pauseBtn i{width:4px;height:12px;background:var(--ink);display:block}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding-bottom:8px}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--deep);box-shadow:0 0 0 3px var(--edge)}
.banner{position:absolute;left:50%;top:24%;transform:translateX(-50%);padding:8px 14px;background:var(--scrim);border:3px solid var(--hurt);font-size:15px;white-space:nowrap;pointer-events:none}
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;gap:12px;padding-block:20px;overflow-y:auto}
.overlay>:first-child{margin-top:auto}
.overlay>:last-child{margin-bottom:auto}
.overlay h2{margin:0;text-align:center;font-weight:400;font-size:26px;letter-spacing:.08em}
.overlay .sub{margin:0;text-align:center;color:var(--dim);font-size:13px}
.cards{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;margin:0 auto}
.card{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:left;padding:10px 12px;background:var(--panel);border:3px solid var(--c,var(--edge));box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.card:disabled{opacity:.55;cursor:wait}
.card .ic{width:48px;height:48px;display:grid;place-items:center;background:var(--deep);border:2px solid var(--c,var(--edge));font-size:22px;color:var(--c,var(--ink))}
.card .ic img{width:42px;height:42px;image-rendering:pixelated}
.cbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctop b{font-weight:400;font-size:17px;line-height:1.3}
.ctop em{font-style:normal;font-size:11px;color:var(--deep);background:var(--c,var(--go));padding:0 6px}
.pips{display:flex;align-items:center;gap:3px}
.pips i{width:12px;height:6px;background:var(--edge)}
.pips i.on{background:var(--c)}
.pips i.nx{background:#ffffff;animation:pip .8s steps(2) infinite}
.pips small{font-family:var(--f-num);font-size:8px;color:var(--dim);margin-left:6px}
@keyframes pip{50%{background:var(--c)}}
.card .d{font-size:13px;color:var(--dim);line-height:1.4}
.build{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.build p{margin:0;font-size:12px;color:var(--dim)}
.build ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.build li{display:flex;align-items:center;gap:3px;padding:2px 6px 2px 2px;background:var(--panel);border:2px solid var(--edge);border-bottom-color:var(--c,var(--edge))}
.build li img{width:22px;height:22px;image-rendering:pixelated}
.build li .ch{width:22px;height:22px;display:grid;place-items:center;font-size:13px;color:var(--c)}
.build li b{font-family:var(--f-num);font-weight:400;font-size:8px}
.btnrow{display:flex;flex-direction:column;gap:10px;max-width:320px;width:100%;margin:0 auto}
.stats{list-style:none;margin:0 auto;padding:12px 14px;max-width:320px;width:100%;background:var(--panel);border:3px solid var(--edge);display:flex;flex-direction:column;gap:6px}
.stats li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.stats li b{font-family:var(--f-num);font-weight:400;font-size:11px;align-self:center;white-space:nowrap}
.stats li.total{border-top:2px dashed var(--edge);padding-top:8px;color:var(--go)}
.tagnew{display:block;margin:0 auto;padding:2px 10px;background:var(--go);color:var(--go-ink);font-size:13px;width:max-content}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<section id="title" hidden>
  <canvas id="titleCv" aria-hidden="true"></canvas>
  <div class="tbox">
    <h1 class="logo"><span class="gname">SHOOT</span><small>シューティング × サバイバー</small></h1>
    <div class="tbtns">
      <button id="startBtn" class="go" type="button">スタート</button>
      <div class="hrow"><button id="howBtn" class="btn3" type="button">遊び方</button><button id="sndBtn" class="btn3" type="button" aria-pressed="true">音 ON</button></div>
    </div>
  </div>
</section>

<div id="howto" class="howbg" hidden><div class="howbox" role="dialog" aria-label="遊び方">
  <div id="howCard" class="howcard"></div>
  <div class="hrow"><button id="howPrev" class="btn3" type="button">もどる</button><button id="howNext" class="go" type="button">次へ</button></div>
</div></div>

<main id="hangar" hidden>
  <header class="top">
    <button id="toTitle" class="btn3 sq" type="button" aria-label="タイトルへ">◀</button>
    <div class="ttl"><h1>格納庫<small>試作5</small></h1></div>
    <div class="gold" aria-label="持っているお金"><img class="coin" alt=""><b id="goldNum" class="num">0</b><small>G</small></div>
    <button id="shopBtn" class="shopbtn" type="button">ショップ<span id="shopDot" class="badge" hidden></span></button>
  </header>

  <div class="bay" id="bay">
    <canvas id="editor" aria-hidden="true"></canvas>
    <p class="shipcap"><b id="shipName">スタンダード</b><small id="shipSkill"></small></p>
    <div class="slots" id="slots"></div>
    <button id="shipPrev" class="navb" type="button" aria-label="前の機体">◀</button>
    <button id="shipNext" class="navb" type="button" aria-label="次の機体">▶</button>
    <div class="lockbox" id="lockbox" hidden></div>
    <div class="finger" id="finger" hidden><span aria-hidden="true">👆</span><b>ここをタップ</b></div>
    <div class="dots" id="dots"></div>
    <p class="toast" id="note" aria-live="polite" hidden></p>
  </div>

  <div class="hrow">
    <button id="infoBtn" class="btn3" type="button">くわしく</button>
    <button id="launchBtn" class="go" type="button">出撃</button>

function flameFrames(w,h,list,extra){

  return [0,2,4,1].map(t=>{const c=document.createElement('canvas');c.width=w+4;c.height=h+4+extra;const g=c.getContext('2d');
    for(const [x0,x1,top,ln] of list){const L=ln+t,cx=(x0+x1)/2;
      for(let y=top;y<top+L;y++){const k=(y-top)/L,hw=(x1-x0+1)*(1-k*0.8)/2;
        for(let x=x0;x<=x1;x++){if(Math.abs(x-cx)>hw)continue;const ci=Math.min(4,Math.floor(k*4+Math.abs(x-cx)/(hw+.01)*1.5));g.fillStyle=cols[ci];g.fillRect(x+2,y+2,1,1);}}}
    return c;});
}

  const cur=u.k==='wmax'?Math.max(r.wmax.sword||0,r.wmax.saw||0):u.k==='sup5'?r.sup5.length:r[u.k];return {ok:cur>=u.n,cur:Math.min(cur,u.n),n:u.n};}

/* ---------- 効果音（Web Audio でコードで作る・音のファイルは使わない） ---------- */
const SFX=(()=>{
  const VOLUME=0.32;            /* 全体の音の大きさはここ1か所 */
  let ac=null,master=null,noiseBuf=null;const last={};let made=0;
  function init(){
    if(ac)return true;
    try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;
      try{if(navigator.audioSession)navigator.audioSession.type='ambient';}catch(_){}
      ac=new A();master=ac.createGain();master.gain.value=VOLUME;
      const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;master.connect(comp);comp.connect(ac.destination);
      noiseBuf=ac.createBuffer(1,ac.sampleRate*0.6,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){ac=null;return false;}
    return true;
  }
  /* 最初のタップで音を始める（iPhone の決まり） */
  function unlock(){if(!init())return;if(ac.state!=='running'&&ac.state!=='closed')ac.resume().catch(()=>{});}
  const on=()=>save.snd!==false&&ac&&ac.state!=='closed';
  /* 1つの音：type・高さ f0→f1・長さ・大きさ・はじまりの遅れ */
  function tone(type,f0,f1,dur,vol,delay){
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.012,dur*0.2));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);made++;
  }
  function noise(dur,vol,fType,f0,f1,delay,q){
    const t=ac.currentTime+(delay||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=noiseBuf;f.type=fType||'lowpass';f.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||0.8;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);made++;
  }
  /* 武器ごとに少しちがう撃つ音（何百発も撃つので、とくに小さく・間引く） */
  const SHOT={
    laser:()=>tone('square',1320,700,0.05,0.035),
    gatling:()=>noise(0.03,0.04,'highpass',2400,2400),
    mine:()=>tone('sine',220,110,0.09,0.06),
    shotgun:()=>noise(0.09,0.07,'lowpass',2200,500),
    freeze:()=>{tone('triangle',1800,2400,0.07,0.035);tone('sine',2600,2600,0.05,0.02,0.03);},
    missile:()=>noise(0.16,0.045,'bandpass',600,2400,0,2),
    flame:()=>noise(0.08,0.022,'lowpass',900,500),
    sword:()=>noise(0.12,0.07,'bandpass',800,3200,0,3),
    saw:()=>tone('sawtooth',500,700,0.08,0.03),
    thunder:()=>{noise(0.14,0.07,'highpass',1500,800);tone('square',90,60,0.08,0.03);},
    gravity:()=>tone('sine',300,90,0.22,0.06),
    cannon:()=>{tone('sawtooth',160,50,0.3,0.08);noise(0.25,0.06,'lowpass',1800,200);},
  };
  const GAP={shot:0.07,hit:0.045,kill:0.035,xp:0.04,btn:0.05};
  const SND={
    hit:()=>tone('square',260,180,0.025,0.025),
    kill:()=>{noise(0.07,0.06,'lowpass',1800,300);tone('square',420,140,0.06,0.025);},
    boss:()=>{noise(1.1,0.22,'lowpass',1600,60);tone('sine',90,30,1.0,0.25);tone('square',140,40,0.5,0.06,0.15);},
    xp:p=>tone('sine',900+p*40,1300+p*40,0.05,0.03),
    coin:()=>{tone('square',1320,1320,0.06,0.04);tone('square',1760,1760,0.14,0.04,0.06);},
    lvup:()=>[523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,0.14,0.07,i*0.07)),
    hurt:()=>{tone('square',240,70,0.18,0.08);noise(0.12,0.06,'lowpass',900,200);},
    barrier:()=>tone('triangle',700,1400,0.16,0.06),
    buy:()=>{tone('square',988,988,0.07,0.05);tone('square',1319,1319,0.2,0.05,0.07);tone('triangle',1976,1976,0.18,0.03,0.12);},
    btn:()=>tone('triangle',660,880,0.04,0.035),
    clear:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone('triangle',f,f,i===6?0.5:0.14,0.08,i*0.11)),
    over:()=>[392,330,262,196].forEach((f,i)=>tone('triangle',f,f*0.97,i===3?0.6:0.2,0.07,i*0.16)),
    start:()=>{tone('sawtooth',220,880,0.35,0.05);noise(0.4,0.05,'bandpass',400,3000,0,1.5);},
  };
  function play(name,arg){
    if(!on())return;const now=ac.currentTime,gap=GAP[name]||0.02;
    if(last[name]!=null&&now-last[name]<gap)return;last[name]=now;
    try{SND[name](arg||0);}catch(_){}
  }
  function shot(t){
    if(!on()||!SHOT[t])return;const now=ac.currentTime;
    if(last.shot!=null&&now-last.shot<GAP.shot)return;
    const k='s_'+t,g=t==='gatling'||t==='flame'?0.12:t==='laser'?0.1:0.08;if(last[k]!=null&&now-last[k]<g)return;
    last.shot=now;last[k]=now;try{SHOT[t]();}catch(_){}
  }
  return {unlock,play,shot,get made(){return made},get ready(){return !!ac}};
})();

function toast(msg){const n=$('note');n.textContent=msg;n.hidden=false;clearTimeout(noteT);noteT=setTimeout(()=>{n.hidden=true;},2200);}

function layoutEditor(){
  const r=bay.getBoundingClientRect();if(r.width<2||r.height<2)return;
  const dpr=Math.min(3,window.devicePixelRatio||1);
  const W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);
  edCv.width=W;edCv.height=H;
  const top=52*dpr,bot=26*dpr,k=Math.max(1,Math.floor(Math.min(W-40*dpr,H-top-bot)/96));/* 96＝機体と装備が入る大きさ */
  EV={dpr,k,W,H,css:k/dpr,ox:Math.round((W-SS*k)/2),oy:Math.round(top+(H-top-bot-SS*k)/2)};
  drawEditor();
}
const slotCss=i=>{const s=SHIPS[view].slots[i];return [(EV.ox+(SC+s.x+0.5)*EV.k)/EV.dpr,(EV.oy+(SC+s.y+0.5)*EV.k)/EV.dpr];};
function drawEditor(){
  const own=haveShip(view),open=own||shipProg(view).ok,sp=SHIPSPR[view];
  ssg.clearRect(0,0,SS,SS);
  if(open){ssg.globalAlpha=own?1:0.55;ssg.drawImage(sp.fl[0],SC-sp.cx,SC-sp.cy);ssg.drawImage(sp.img,SC-sp.cx,SC-sp.cy);ssg.globalAlpha=1;}
  else ssg.drawImage(shipSil(view),SC-sp.cx,SC-sp.cy);
  if(own)save.ships[view].eq.forEach((v,i)=>{if(!v)return;const m=MSPR[v.t][v.d],s=SHIPS[view].slots[i];ssg.drawImage(m.img,SC+s.x-m.cx,SC+s.y-m.cy);});
  const g=ed,{W,H,k,ox,oy,dpr}=EV;
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle='#05060f';g.fillRect(0,0,W,H);
  g.fillStyle='#181b44';const step=k*6,dot=Math.max(1,Math.round(dpr));
  for(let y=oy%step;y<H;y+=step)for(let x=ox%step;x<W;x+=step)g.fillRect(Math.round(x),Math.round(y),dot,dot);
  g.imageSmoothingEnabled=false;g.drawImage(ssCv,ox,oy,SS*k,SS*k);
}
function renderSlots(){

function mountAt(j,t){

let shopCat='atk',shopNote='';
const SHOP_TABS=[['ship','機体'],['atk','攻撃'],['def','防御'],['sup','補助']];
const tabOf=k=>SHIPS[k]?'ship':MODS[k]?MODS[k].cat:null;
const canBuy=k=>SHIPS[k]?(!haveShip(k)&&shipProg(k).ok&&save.gold>=SHIPS[k].price):(save.owned[k]===0&&save.gold>=MODS[k].price);
function shopList(cat){return cat==='ship'?SHIP_IDS:TYPES.filter(t=>MODS[t].cat===cat);}
function renderShop(){

  const tabs=$('shopTabs');tabs.textContent='';
  SHOP_TABS.forEach(([k,label])=>{const b=el('button',null,label);b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',shopCat===k?'true':'false');

    b.addEventListener('click',()=>{shopCat=k;shopNote='';renderShop();$('shopGrid').scrollTop=0;});tabs.appendChild(b);});

  shopList(shopCat).forEach(k=>{
    const isShip=!!SHIPS[k],it=isShip?SHIPS[k]:MODS[k],b=el('button','sitem'+(canBuy(k)?' can':''));b.type='button';b.style.setProperty('--c',it.c);

    let price;
    if(isShip){const pg=shipProg(k),have=haveShip(k);img.src=(have||pg.ok?SHIPSPR[k].img:shipSil(k)).toDataURL();
      price=have?el('small','short','持っている'):pg.ok?el('small',save.gold<it.price?'short':null,it.price+'G'):el('small','short','解放 '+pg.cur+'/'+pg.n);}
    else{img.src=ICON[k];price=el('small',save.gold<it.price?'short':null,it.price+'G');if(save.owned[k]>0)b.appendChild(el('i',null,'×'+save.owned[k]));}

}
function buyShip(id){const sh=SHIPS[id];if(haveShip(id)||!shipProg(id).ok||save.gold<sh.price)return false;
  save.gold-=sh.price;save.ships[id].have=true;sh.start.forEach(v=>{if(save.owned[v.t]<sh.start.filter(w=>w.t===v.t).length)save.owned[v.t]++;});
  save.ships[id].eq=startLoad(id);persist();return true;}
function openDetail(k){
  const isShip=!!SHIPS[k],it=isShip?SHIPS[k]:MODS[k];
  const s=openSheet(it.name,isShip?'機体':CATS[it.cat],it.c,()=>renderShop());
  const top=el('div','dtop'),img=el('img');img.alt='';
  const info=el('div');
  if(isShip){const pg=shipProg(k);img.src=(haveShip(k)||pg.ok?SHIPSPR[k].img:shipSil(k)).toDataURL();
    info.append(el('p',null,it.desc+'。'),el('p',null,'能力：'+it.skill+'。'),el('p',null,'装備の場所 '+it.slots.length+'か所・はじめの武器 '+it.start.map(v=>MODS[v.t].name).join('と')));}
  else{img.src=ICON[k];info.append(el('p',null,it.desc));}

/* spatial grid */
function buildGrid(){
  const c=Math.ceil((GW+PADG*2)/CELL),r=Math.ceil((GH+PADG*2)/CELL);
  if(!grid||c!==gCols||r!==gRows){gCols=c;gRows=r;grid=Array.from({length:c*r},()=>[]);}
  else for(let i=0;i<grid.length;i++)grid[i].length=0;
  gMaxR=33;
  for(const e of R.E){if(e.dead)continue;if(e.r>gMaxR)gMaxR=e.r;
    const cx=clamp(Math.floor((e.x+PADG)/CELL),0,gCols-1),cy=clamp(Math.floor((e.y+PADG)/CELL),0,gRows-1);
    grid[cy*gCols+cx].push(e);}
}
function near(x,y,r,fn){
  const rr=r+gMaxR+2;/* 大型の敵（当たり54）もとらえる */
  const x0=clamp(Math.floor((x-rr+PADG)/CELL),0,gCols-1),x1=clamp(Math.floor((x+rr+PADG)/CELL),0,gCols-1);
  const y0=clamp(Math.floor((y-rr+PADG)/CELL),0,gRows-1),y1=clamp(Math.floor((y+rr+PADG)/CELL),0,gRows-1);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const cell=grid[cy*gCols+cx];
    for(let i=0;i<cell.length;i++){const e=cell[i];if(e.dead)continue;if(fn(e)===true)return;}}
}

function ring(x,y,rad,cols){for(let i=0;i<18;i++){const a=i/18*TAU,v=rad*4;addPart(x,y,Math.cos(a)*v,Math.sin(a)*v,.22,cols[i%cols.length],2);}}

/* update steps */
function movePlayer(dt){
  const spd=185*U*R.sh.spd*(1+0.12*R.pas.speed+R.bonus.speed);let kx=0,ky=0;
  if(keys.has('ArrowLeft')||keys.has('a'))kx-=1;if(keys.has('ArrowRight')||keys.has('d'))kx+=1;
  if(keys.has('ArrowUp')||keys.has('w'))ky-=1;if(keys.has('ArrowDown')||keys.has('s'))ky+=1;
  if(kx||ky){const l=Math.hypot(kx,ky);R.x+=kx/l*spd*dt;R.y+=ky/l*spd*dt;}
  else if(R.target){const dx=R.target.x-R.x,dy=R.target.y-R.y,d=Math.hypot(dx,dy),st=spd*1.25*dt;
    if(d<=st){R.x=R.target.x;R.y=R.target.y;}else{R.x+=dx/d*st;R.y+=dy/d*st;}}
  R.x=clamp(R.x,PMX,GW-PMX);R.y=clamp(R.y,PMY,GH-PMY);
}
const PMX=26,PMY=34;/* 自機が画面のはしで止まる位置 */
function shootAt(e,spd,off){spd*=U;const a=Math.atan2(R.y-e.y,R.x-e.x)+off;R.EB.push({x:e.x,y:e.y+e.r*0.6,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg:8,dead:false});}
function moveEnemies(dt){
  const damp=Math.pow(0.03,dt),lerp=Math.min(1,dt*3);
  for(const e of R.E){
    if(e.flash>0)e.flash-=dt;
    let sf=1;if(e.slow>0){sf=e.kind==='boss'?Math.max(0.6,e.slowF):e.slowF;e.slow-=dt;if(e.slow<=0)e.slowF=1;}
    const dx=R.x-e.x,dy=R.y-e.y,d=Math.hypot(dx,dy)||1;let tx=0,ty=0;
    if(e.kind==='bug'){tx=dx/d*e.spd;ty=dy/d*e.spd;}
    else if(e.kind==='tank'){tx=dx/d*e.spd*0.6;ty=dy/d*e.spd*0.6+e.spd*0.5;}
    else if(e.kind==='shooter'){
      if(e.y<e.stopY)ty=e.spd*1.6;else{tx=Math.sin(R.t*1.3+e.id)*32*U;ty=7*U;}
      e.fire-=dt*sf;if(e.fire<=0&&e.y>0&&e.y<GH){e.fire=rand(2,3);shootAt(e,92,0);}
    }else{
      tx=clamp(dx*0.6,-e.spd*1.5,e.spd*1.5);ty=(GH*0.2-e.y)*0.8;
      e.fire-=dt*sf;if(e.fire<=0){e.fire=2.4;for(let k=-2;k<=2;k++)shootAt(e,85,k*0.28);}
    }
    tx*=sf;ty*=sf;
    e.vx+=(tx-e.vx)*lerp;e.vy+=(ty-e.vy)*lerp;e.kx*=damp;e.ky*=damp;
    e.x+=(e.vx+e.kx)*dt;e.y+=(e.vy+e.ky)*dt;
    if(e.y>GH+105||e.y<-210||e.x<-150||e.x>GW+150)e.dead=true;
  }
}
function separate(){
  for(const e of R.E){if(e.dead||e.kind==='boss')continue;
    near(e.x,e.y,e.r+13.5,o=>{if(o===e)return;const dx=e.x-o.x,dy=e.y-o.y,md=e.r+o.r-1.5,d2=dx*dx+dy*dy;
      if(d2>0.0001&&d2<md*md){const d=Math.sqrt(d2),p=(md-d)*0.35;e.x+=dx/d*p;e.y+=dy/d*p;}});}
}
const modPos=m=>[R.x+SLOTS[m.slot].x,R.y+SLOTS[m.slot].y];
function nearest(x,y,maxD){let best=null,bd=maxD*maxD;for(const e of R.E){if(e.dead||e.y<-6)continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e;}}return best;}
/* bullet kinds: 0 laser, 1 ally, 2 flame, 3 freeze, 4 reflected, 5 gatling, 6 pellet */
function mkB(x,y,vx,vy,dmg,pierce,k,extra){const b={x,y,vx,vy,dmg,pierce:pierce||0,hits:pierce>0?new Set():null,k:k||0,dead:false};return extra?Object.assign(b,extra):b;}
function jag(pts){
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){const [ax,ay]=pts[i-1],[bx,by]=pts[i],dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
    for(let k=1;k<4;k++){const o=rand(-7.5,7.5);out.push([ax+dx*k/4+nx*o,ay+dy*k/4+ny*o]);}out.push(pts[i]);}
  return out;
}
const FIRE={
  laser(m,st,ox,oy,ux,uy){for(let k=0;k<st.n;k++){const off=(k-(st.n-1)/2)*6;R.B.push(mkB(ox+ux*14-uy*off,oy+uy*14+ux*off,ux*st.spd,uy*st.spd,st.dmg,st.pierce,0));}},
  gatling(m,st,ox,oy,ux,uy){const base=Math.atan2(uy,ux);for(let k=0;k<st.n;k++){const a=base+rand(-st.spread,st.spread),off=st.n===2?(k?4:-4):0;
    R.B.push(mkB(ox+ux*14-uy*off,oy+uy*14+ux*off,Math.cos(a)*st.spd,Math.sin(a)*st.spd,st.dmg,st.pierce,5,{kb:0.06}));}},
  mine(m,st,ox,oy,ux,uy){const base=Math.atan2(uy,ux);for(let k=0;k<st.n;k++){const a=base+(k-(st.n-1)/2)*0.5;
    R.MN.push({x:ox+ux*9,y:oy+uy*9,vx:Math.cos(a)*95*U,vy:Math.sin(a)*95*U,t:0,dmg:st.dmg,rad:st.rad,dead:false});}},
  shotgun(m,st,ox,oy,ux,uy){const base=Math.atan2(uy,ux);for(let k=0;k<st.n;k++){const a=base+(k/(st.n-1)-0.5)*st.cone+rand(-0.04,0.04),v=st.spd*rand(0.88,1.1);
    R.B.push(mkB(ox+ux*12,oy+uy*12,Math.cos(a)*v,Math.sin(a)*v,st.dmg,st.pierce,6,{life:st.life,kb:0.35}));}},
  freeze(m,st,ox,oy,ux,uy){for(let k=0;k<st.n;k++){const off=st.n===2?(k?4.5:-4.5):0;
    R.B.push(mkB(ox+ux*14-uy*off,oy+uy*14+ux*off,ux*st.spd,uy*st.spd,st.dmg,st.pierce,3,{slowT:st.slowT,slowF:st.slowF}));}},
  missile(m,st,ox,oy,ux,uy){const a=Math.atan2(uy,ux);for(let k=0;k<st.n;k++){const off=(k-(st.n-1)/2)*0.4;
    R.M.push({x:ox+ux*9,y:oy+uy*9,a:a+off,spd:100*U,dmg:st.dmg,rad:st.rad,target:null,life:3.2,tr:0,dead:false});}},
  flame(m,st,ox,oy,ux,uy){const a=Math.atan2(uy,ux)+rand(-st.spread,st.spread),v=st.spd*rand(0.85,1.15);
    R.B.push(mkB(ox+ux*12,oy+uy*12,Math.cos(a)*v,Math.sin(a)*v,st.dmg,999,2,{life:st.life,max:st.life,kb:0.02}));},
  sword(m,st,ox,oy,ux,uy){const a=Math.atan2(uy,ux);
    R.S.push({m,t:0,dur:st.dur,a,sweep:st.sweep,range:st.range,dmg:st.dmg,hits:new Set(),done:false,dead:false});
    if(st.twice)R.S.push({m,t:-0.18,dur:st.dur,a,sweep:st.sweep,range:st.range,dmg:st.dmg,hits:new Set(),done:false,dead:false});},
  saw(m,st,ox,oy,ux,uy){const base=Math.atan2(uy,ux);for(let k=0;k<st.n;k++){const a=base+(k-(st.n-1)/2)*0.45;
    R.W.push({m,x:ox,y:oy,ux:Math.cos(a),uy:Math.sin(a),t:0,v0:st.v0,r:st.big?12:9,big:st.big,dmg:st.dmg,hits:new Map(),dead:false});}},
  thunder(m,st,ox,oy,ux,uy){
    const base=Math.atan2(uy,ux);let best=null,bd=st.range*st.range;
    for(const e of R.E){if(e.dead||e.y<-4)continue;const dx=e.x-ox,dy=e.y-oy,d=dx*dx+dy*dy;if(d>=bd)continue;if(Math.abs(angDiff(Math.atan2(dy,dx),base))>1.15)continue;bd=d;best=e;}
    if(!best)return false;
    const chain=[best],pts=[[ox,oy],[best.x,best.y]];let cur=best;
    for(let i=0;i<st.chain;i++){let nx=null,nd=108*108;
      for(const e of R.E){if(e.dead||chain.includes(e))continue;const dx=e.x-cur.x,dy=e.y-cur.y,d=dx*dx+dy*dy;if(d<nd){nd=d;nx=e;}}
      if(!nx)break;chain.push(nx);pts.push([nx.x,nx.y]);cur=nx;}
    chain.forEach(e=>hit(e,st.dmg,0,0));
    R.Z.push({poly:jag(pts),t:0,dead:false});
  },
  gravity(m,st,ox,oy,ux,uy){R.GV.push({x:ox+ux*12,y:oy+uy*12,vx:ux*85*U,vy:uy*85*U,t:0,life:st.life,r:st.r,dmg:st.dmg,tick:0,boom:st.boom,dead:false});},
  cannon(m,st,ox,oy,ux,uy){
    const sx=ox+ux*15,sy=oy+uy*15;
    for(const e of R.E){if(e.dead)continue;const dx=e.x-sx,dy=e.y-sy,pr=dx*ux+dy*uy;if(pr<-e.r||pr>st.len)continue;
      if(Math.abs(dx*uy-dy*ux)<=st.w/2+e.r)hit(e,st.dmg,ux*90,uy*90);}
    for(const b of R.EB){const dx=b.x-sx,dy=b.y-sy,pr=dx*ux+dy*uy;if(pr>=0&&pr<=st.len&&Math.abs(dx*uy-dy*ux)<=st.w/2+4.5)b.dead=true;}
    R.L.push({x:sx,y:sy,ux,uy,w:st.w,len:st.len,t:0,dead:false});
  },
};
function fire(dt){
  for(const m of R.mods){
    const f=FIRE[m.t];if(!f)continue;
    const st=stat(m.t);m.cd-=dt;if(m.cd>0)continue;
    const [ox,oy]=modPos(m),a=dirAngle(m.d);
    const ok=f(m,st,ox,oy,Math.cos(a),Math.sin(a))!==false;m.cd=ok?st.cd:0.15;if(ok)SFX.shot(m.t);
  }
}
const SPK={0:'#bfefff',1:'#c4ffe3',3:'#e9f8ff',4:'#ffffff',5:'#c9d6ff',6:'#ffe2a8'};
function moveBullets(dt){
  for(const b of R.B){
    if(b.life!=null){b.life-=dt;if(b.life<=0){b.dead=true;continue;}}
    const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/9)),sx=b.vx*dt/steps,sy=b.vy*dt/steps;
    for(let s=0;s<steps&&!b.dead;s++){
      b.x+=sx;b.y+=sy;
      if(b.x<-15||b.x>GW+15||b.y<-15||b.y>GH+15){b.dead=true;break;}
      near(b.x,b.y,6,e=>{
        if(b.hits&&b.hits.has(e.id))return;
        const dx=e.x-b.x,dy=e.y-b.y,rr=e.r+(b.k===2?6:3);
        if(dx*dx+dy*dy<=rr*rr){
          const kb=b.kb!=null?b.kb:0.12;hit(e,b.dmg,b.vx*kb,b.vy*kb);
          if(b.slowT){e.slow=Math.max(e.slow,b.slowT);e.slowF=Math.min(e.slowF,b.slowF);}
          if(b.k!==2)spark(b.x,b.y,SPK[b.k]||'#ffffff',b.k===1?'g':b.k===6?'y':'w');
          if(b.pierce>0){b.pierce--;b.hits.add(e.id);}else{b.dead=true;return true;}
        }
      });
    }
  }
}
function explode(ms){ms.dead=true;blast(ms.x,ms.y,ms.rad,ms.dmg,107*U,['#ffd23f','#fff3b0','#ff9f43']);addX(ms.x,ms.y,EXPL.s,0.3);}
function moveMissiles(dt){
  for(const ms of R.M){
    if(ms.dead)continue;
    ms.life-=dt;
    if(!ms.target||ms.target.dead)ms.target=nearest(ms.x,ms.y,280*U);
    if(ms.target){const want=Math.atan2(ms.target.y-ms.y,ms.target.x-ms.x),mt=5.5*dt;ms.a+=clamp(angDiff(want,ms.a),-mt,mt);}
    ms.spd=Math.min(285*U,ms.spd+360*U*dt);
    ms.x+=Math.cos(ms.a)*ms.spd*dt;ms.y+=Math.sin(ms.a)*ms.spd*dt;
    ms.tr-=dt;if(ms.tr<=0){ms.tr=0.03;addPart(ms.x-Math.cos(ms.a)*6,ms.y-Math.sin(ms.a)*6,rand(-15,15),rand(-15,15),0.3,Math.random()<0.5?'#ffb032':'#7a5a74',2);}
    let boom=false;
    near(ms.x,ms.y,6,e=>{const dx=e.x-ms.x,dy=e.y-ms.y,rr=e.r+4.5;if(dx*dx+dy*dy<=rr*rr){boom=true;return true;}});
    if(boom||ms.life<=0)explode(ms);
    else if(ms.x<-45||ms.x>GW+45||ms.y<-45||ms.y>GH+45)ms.dead=true;
  }
}
function slashes(dt){
  for(const s of R.S){
    s.t+=dt;if(s.t>s.dur+0.1){s.dead=true;continue;}
    if(s.done||s.t<0)continue;
    const [ox,oy]=modPos(s.m),p=Math.min(1,s.t/s.dur),a0=s.a-s.sweep/2;
    near(ox,oy,s.range,e=>{
      if(s.hits.has(e.id))return;
      const dx=e.x-ox,dy=e.y-oy,d=Math.hypot(dx,dy)||1;if(d>s.range+e.r)return;
      const rel=angDiff(Math.atan2(dy,dx),a0);
      if(d<12||(rel>=-0.2&&rel<=s.sweep*p+0.2)){s.hits.add(e.id);hit(e,s.dmg,dx/d*230*U,dy/d*230*U);}
    });
    if(p>=1)s.done=true;
  }
}
function defenses(){
  for(const m of R.mods){
    if(m.t!=='shield'&&m.t!=='reflector')continue;
    const st=stat(m.t),[ox,oy]=modPos(m),a=dirAngle(m.d),inArc=(dx,dy,pad)=>Math.abs(angDiff(Math.atan2(dy,dx),a))<=st.half+pad;
    if(m.t==='shield'){
      near(ox,oy,st.R+4.5,e=>{
        const dx=e.x-ox,dy=e.y-oy,d=Math.hypot(dx,dy)||1;if(d>st.R+e.r||!inArc(dx,dy,0.15))return;
        if(R.t-e.shield<st.hitcd)return;
        e.shield=R.t;hit(e,st.dmg,dx/d*200*U,dy/d*200*U);
      });
      for(const b of R.EB){if(b.dead)continue;const dx=b.x-ox,dy=b.y-oy;if(Math.hypot(dx,dy)<=st.R+6&&inArc(dx,dy,0.1)){b.dead=true;spark(b.x,b.y,'#c4ffe3','g');}}
    }else{
      for(const b of R.EB){if(b.dead)continue;const dx=b.x-ox,dy=b.y-oy,d=Math.hypot(dx,dy)||1;
        if(d<=st.R+6&&inArc(dx,dy,0.1)){b.dead=true;R.B.push(mkB(b.x,b.y,dx/d*st.spd,dy/d*st.spd,st.dmg,st.pierce,4));spark(b.x,b.y,'#ffffff');}}
      near(ox,oy,st.R+4.5,e=>{
        const dx=e.x-ox,dy=e.y-oy,d=Math.hypot(dx,dy)||1;if(d>st.R+e.r||!inArc(dx,dy,0.15))return;
        if(R.t-e.refl<0.5)return;e.refl=R.t;hit(e,st.dmg*0.4,dx/d*170*U,dy/d*170*U);
      });
    }
  }
}
function weaponFx(dt){
  for(const w of R.W){
    w.t+=dt;const [mx,my]=modPos(w.m);
    if(w.t<0.5){const v=w.v0*(1-w.t/0.5);w.x+=w.ux*v*dt;w.y+=w.uy*v*dt;}
    else{const dx=mx-w.x,dy=my-w.y,d=Math.hypot(dx,dy)||1,v=Math.min(420*U,(w.t-0.5)*650*U);w.x+=dx/d*v*dt;w.y+=dy/d*v*dt;if(d<12)w.dead=true;}
    if(w.t>3)w.dead=true;
    near(w.x,w.y,w.r,e=>{const dx=e.x-w.x,dy=e.y-w.y,rr=w.r+e.r;if(dx*dx+dy*dy>rr*rr)return;
      const lt=w.hits.get(e.id);if(lt!=null&&R.t-lt<0.25)return;w.hits.set(e.id,R.t);hit(e,w.dmg,dx*3,dy*3);spark(w.x+dx/2,w.y+dy/2,'#ffffff');});
  }
  for(const n of R.MN){
    n.t+=dt;const damp=Math.pow(0.15,dt);n.vx*=damp;n.vy*=damp;n.x+=n.vx*dt;n.y+=(n.vy+6*U)*dt;
    let trig=n.t>7;
    if(!trig&&n.t>0.25)near(n.x,n.y,21,e=>{const dx=e.x-n.x,dy=e.y-n.y,rr=18+e.r;if(dx*dx+dy*dy<=rr*rr){trig=true;return true;}});
    if(trig){n.dead=true;blast(n.x,n.y,n.rad,n.dmg,140*U,['#ffffff','#ffd23f','#8ea0c8']);addX(n.x,n.y,EXPL.m,0.42);}
    else if(n.y>GH+30||n.y<-30||n.x<-30||n.x>GW+30)n.dead=true;
  }
  for(const o of R.GV){
    o.t+=dt;const damp=Math.pow(0.3,dt);o.vx*=damp;o.vy*=damp;o.x+=o.vx*dt;o.y+=o.vy*dt;
    o.tick-=dt;const tick=o.tick<=0;if(tick)o.tick=0.25;
    near(o.x,o.y,o.r,e=>{const dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy)||1;if(d>o.r+e.r)return;
      if(e.kind!=='boss'){const s=Math.min(d,(40+70*(1-Math.min(1,d/o.r)))*U*dt);e.x+=dx/d*s;e.y+=dy/d*s;}
      if(tick)hit(e,o.dmg,0,0);});
    if(o.t>=o.life){o.dead=true;if(o.boom){blast(o.x,o.y,o.r,o.dmg*12,160*U,['#ffffff','#d9ccff','#7a5cff']);addX(o.x,o.y,EXPL.m,0.5);}}
  }
  for(const z of R.Z){z.t+=dt;if(z.t>0.16)z.dead=true;}
  for(const l of R.L){l.t+=dt;if(l.t>0.3)l.dead=true;}
}

/* support: 援軍・子機・空爆・バリア・自動修理 */
function allyShot(x,y,e,spd,dmg){const an=Math.atan2(e.y-y,e.x-x);R.B.push(mkB(x,y,Math.cos(an)*spd,Math.sin(an)*spd,dmg,0,1));}
function callWing(){
  const side=Math.random()<0.5?1:-1,n=Math.min(6,1+R.sup.wing),y0=rand(GH*0.22,GH*0.55);
  for(let i=0;i<n;i++)R.A.push({x:side>0?-24-i*36:GW+24+i*36,y:y0+(i%2?21:0),vx:side*120*U,cd:rand(0,0.3),dead:false});
}
function pickStrike(){
  let best=null,bn=-1;
  for(let k=0;k<12&&R.E.length;k++){
    const e=R.E[(Math.random()*R.E.length)|0];if(e.dead||e.y<15||e.y>GH-15||e.x<0||e.x>GW)continue;
    let n=0;near(e.x,e.y,45,o=>{const dx=o.x-e.x,dy=o.y-e.y;if(dx*dx+dy*dy<2025)n++;});
    if(n>bn){bn=n;best=e;}
  }
  return best;
}
function support(dt){
  const S=R.sup,mul=dmgMul();
  if(S.wing>0){R.wingT-=dt;if(R.wingT<=0){R.wingT=Math.max(6,15-2*(S.wing-1));callWing();}}
  for(const a of R.A){
    a.x+=a.vx*dt;a.cd-=dt;
    if(a.cd<=0&&a.x>6&&a.x<GW-6){const e=nearest(a.x,a.y,240*U);if(e){a.cd=0.32;allyShot(a.x,a.y,e,360*U,(5+2*S.wing)*mul);}else a.cd=0.15;}
    if((a.vx>0&&a.x>GW+60)||(a.vx<0&&a.x<-60))a.dead=true;
  }
  const dn=Math.min(4,S.drone);
  while(R.D.length<dn)R.D.push({x:R.x,y:R.y,cd:rand(0.1,0.5)});
  R.D.forEach((d,i)=>{
    const an=R.t*2.2+i*TAU/dn;d.x=R.x+Math.cos(an)*48;d.y=R.y+Math.sin(an)*44;d.cd-=dt;
    if(d.cd<=0){const e=nearest(d.x,d.y,220*U);if(e){d.cd=S.drone>=5?0.5:0.75;allyShot(d.x,d.y,e,340*U,(4+2*S.drone)*mul);}else d.cd=0.2;}
  });
  if(S.strike>0){R.strikeT-=dt;if(R.strikeT<=0){
    const tg=pickStrike();
    if(tg){R.strikeT=Math.max(3.5,9-1.2*(S.strike-1));R.FX.push({x:tg.x,y:tg.y,t:0,r:(24+4*S.strike)*U,dmg:(30+15*(S.strike-1))*mul,hit:false,dead:false});}
    else R.strikeT=1;}}
  for(const f of R.FX){
    f.t+=dt;
    if(!f.hit&&f.t>=0.4){f.hit=true;blast(f.x,f.y,f.r,f.dmg,120*U,['#ffffff','#fff3b0','#ffd23f']);addX(f.x,f.y,EXPL.m,0.45);}
    if(f.t>0.75)f.dead=true;
  }
  if(S.barrier>0&&!R.bar){R.barCd-=dt;if(R.barCd<=0)R.bar=true;}
  const rg=0.4*R.pas.regen+R.bonus.regen;
  if(rg>0)R.hp=Math.min(R.maxHp,R.hp+rg*dt);
}
function moveEB(dt){
  for(const b of R.EB){if(b.dead)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-18||b.x>GW+18||b.y<-18||b.y>GH+18){b.dead=true;continue;}
    const dx=b.x-R.x,dy=b.y-R.y;if(dx*dx+dy*dy<=56){b.dead=true;hurt(b.dmg);}}
}
function contact(){
  if(R.inv>0)return;
  near(R.x,R.y,18,e=>{const dx=e.x-R.x,dy=e.y-R.y,rr=e.r+7.5;
    if(dx*dx+dy*dy<=rr*rr){hurt(e.dmg*(save.cur==='fortress'?0.6:1));const d=Math.hypot(dx,dy)||1;e.kx+=dx/d*140*U;e.ky+=dy/d*140*U;return true;}});
}
function gems(dt){
  const mag=36*U*R.sh.mag*(1+0.4*R.pas.magnet+R.bonus.magnet),damp=Math.pow(0.05,dt);
  for(const g of R.G){if(g.dead)continue;
    const dx=R.x-g.x,dy=R.y-g.y,d=Math.hypot(dx,dy)||1;
    if(g.pull||d<mag){g.pull=true;g.sp+=460*U*dt;const st=Math.min(g.sp*dt,d);g.x+=dx/d*st;g.y+=dy/d*st;}
    else{g.vx*=damp;g.vy*=damp;g.x+=g.vx*dt;g.y+=(g.vy+18*U)*dt;}
    if(Math.hypot(R.x-g.x,R.y-g.y)<13.5){g.dead=true;gainXp(g.v);SFX.play('xp',(R.xp/R.need*12)|0);}else if(g.y>GH+15)g.dead=true;}
}
function parts(dt){for(const p of R.P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;p.life-=dt;if(p.life<=0)p.dead=true;}}
/* 背景：星3層（ちがう速さ）＋星雲＋遠くの惑星 */
const STAR_SP=[21,54,120];
function stars(dt){for(const s of R.stars){s.y+=STAR_SP[s.l]*dt;if(s.y>GH){s.y-=GH;s.x=rand(0,GW);}}
  R.neb=(R.neb+7*dt)%NEB.height;
  const p=R.pl,pc=PLANETS[p.i];p.y+=11*dt;if(p.y>GH+10){p.i=(p.i+1)%PLANETS.length;const n=PLANETS[p.i];p.x=rand(-n.width*0.3,GW-n.width*0.7);p.y=-n.height-rand(60,400);}}
function parts2(dt){for(const x of R.X){x.t+=dt;if(x.t>=x.dur)x.dead=true;}}
function compact(a){let j=0;for(let i=0;i<a.length;i++)if(!a[i].dead)a[j++]=a[i];a.length=j;}

function update(dt){
  R.t+=dt;R.inv-=dt;R.hurtFx-=dt;
  movePlayer(dt);spawn(dt);moveEnemies(dt);
  buildGrid();separate();
  fire(dt);support(dt);moveBullets(dt);moveMissiles(dt);slashes(dt);defenses();weaponFx(dt);
  moveEB(dt);contact();gems(dt);parts(dt);parts2(dt);stars(dt);
  [R.E,R.B,R.M,R.S,R.EB,R.G,R.P,R.A,R.FX,R.W,R.MN,R.GV,R.Z,R.L,R.X].forEach(compact);
  if(R.hp<=0){endRun(false,false);return;}
  if(R.t>=RUN_LEN){R.t=RUN_LEN;endRun(true,false);return;}
  if(R.pending>0)openLevelUp();
}

/* drawing */
function px2(g,x,y){g.fillRect(Math.round(x)-1,Math.round(y)-1,2,2);}
function px3(g,x,y){g.fillRect(Math.round(x)-1,Math.round(y)-1,3,3);}
function arcPix(g,x,y,a,half,rad,c,al,step){
  const n=Math.ceil(half*2*rad/step);g.fillStyle=c;
  for(let i=0;i<=n;i++){const an=a-half+2*half*i/n;g.globalAlpha=al*((i+((R.t*12)|0))%4===0?1:0.75);px2(g,x+Math.cos(an)*rad,y+Math.sin(an)*rad);}
  g.globalAlpha=1;
}
const STARC=['#2c3060','#6a70b8','#dfe6ff'];
const DS=(g,s,x,y)=>g.drawImage(s.img,Math.round(x)-s.cx,Math.round(y)-s.cy);
function drawBg(g){
  const nh=NEB.height,oy=Math.floor(R.neb);
  for(let y=oy-nh;y<GH;y+=nh)g.drawImage(NEB,0,y);

}
function drawShipAt(g,sh,mods,px,py,t){

    if(m.t==='cannon'&&m.cd<0.6){const a=dirAngle(m.d),q=1-Math.max(0,m.cd)/0.6,r=Math.round(1+q*4);
      g.fillStyle=(((t*24)|0)%2)?'#ffffff':'#5cffef';g.fillRect(Math.round(mx+Math.cos(a)*15)-r,Math.round(my+Math.sin(a)*15)-r,r*2,r*2);}}
}
function draw(){
  const g=ctx;
  g.globalAlpha=1;drawBg(g);
  for(const gm of R.G)DS(g,gm.big?GEMB:GEMS,gm.x,gm.y);
  for(const o of R.GV){
    const rot=R.t*3;g.fillStyle='#a98bff';
    for(let i=0;i<18;i++){const an=rot+i*TAU/18,rr=o.r*(0.45+0.5*((i*7+((R.t*10)|0))%5)/5);g.globalAlpha=0.55;px2(g,o.x+Math.cos(an)*rr,o.y+Math.sin(an)*rr);}
    g.globalAlpha=1;DS(g,GRAV,o.x,o.y);
  }
  for(const e of R.E){const gl=GLOW[e.art||e.kind];g.drawImage(gl,Math.round(e.x)-(gl.width>>1),Math.round(e.y)-(gl.height>>1));}
  for(const e of R.E){const s=ESPR[e.art||e.kind];g.drawImage(e.flash>0?s.flash:e.slow>0?s.ice:s.img,Math.round(e.x)-s.cx,Math.round(e.y)-s.cy);}
  for(const n of R.MN)DS(g,MINE[((n.t*5)|0)%2],n.x,n.y);
  for(const w of R.W)DS(g,SAWS[w.big?1:0][((w.t*20)|0)%2],w.x,w.y);
  const px=Math.round(R.x),py=Math.round(R.y);
  for(const m of R.mods){
    if(m.t!=='shield'&&m.t!=='reflector')continue;
    const st=stat(m.t),ox=px+SLOTS[m.slot].x,oy=py+SLOTS[m.slot].y,a=dirAngle(m.d);
    if(m.t==='shield'){arcPix(g,ox,oy,a,st.half,st.R,'#c4ffe3',1,1.8);arcPix(g,ox,oy,a,st.half,st.R-3,'#5dffb0',0.55,1.8);arcPix(g,ox,oy,a,st.half,st.R-6,'#1fae63',0.35,2);}
    else{arcPix(g,ox,oy,a,st.half,st.R,'#ffffff',1,1.6);arcPix(g,ox,oy,a,st.half,st.R-2,'#b8bce0',0.8,1.6);arcPix(g,ox,oy,a,st.half,st.R-4,'#7d97cf',0.5,1.8);}
  }
  for(const f of R.FX){
    if(f.t<0.4){
      if(((f.t*14)|0)%2===0){const n=Math.ceil(TAU*f.r/3);g.fillStyle='#ffd23f';
        for(let i=0;i<n;i+=2){const an=i/n*TAU;px2(g,f.x+Math.cos(an)*f.r,f.y+Math.sin(an)*f.r);}
        g.fillRect(Math.round(f.x)-9,Math.round(f.y)-1,18,3);g.fillRect(Math.round(f.x)-1,Math.round(f.y)-9,3,18);}
    }else{
      const k=1-(f.t-0.4)/0.35,w=Math.max(2,Math.round(f.r*0.7*k)),x=Math.round(f.x);
      g.globalAlpha=Math.max(0,k)*0.6;g.fillStyle='#ff9f43';g.fillRect(x-w-3,0,w*2+6,Math.round(f.y));
      g.globalAlpha=Math.max(0,k);g.fillStyle='#ffd23f';g.fillRect(x-w,0,w*2,Math.round(f.y));
      g.fillStyle='#ffffff';g.fillRect(x-Math.ceil(w/2),0,Math.ceil(w/2)*2,Math.round(f.y));g.globalAlpha=1;
    }
  }
  for(const s of R.S){
    if(s.t<0)continue;
    const ox=px+SLOTS[s.m.slot].x,oy=py+SLOTS[s.m.slot].y,p=Math.min(1,s.t/s.dur);
    const fade=s.t>s.dur?Math.max(0,1-(s.t-s.dur)/0.1):1,a0=s.a-s.sweep/2,a1=a0+s.sweep*p,tail=Math.max(a0,a1-1.3);
    for(let rad=s.range,j=0;rad>s.range*0.5;rad-=2,j++){
      g.globalAlpha=fade*Math.max(0.25,1-j*0.07);
      const n=Math.max(1,Math.ceil((a1-tail)*rad/1.6));g.fillStyle=j===0?'#ffffff':j<3?'#e6dcff':j<6?'#a98bff':'#6a48e0';
      for(let i=0;i<=n;i++){const an=tail+(a1-tail)*i/n;px2(g,ox+Math.cos(an)*rad,oy+Math.sin(an)*rad);}}
    g.globalAlpha=1;}
  const blink=R.inv>0&&((R.t*16|0)%2===0);
  if(!blink&&R.state!=='over'){
    drawShipAt(g,R.spr,R.mods,px,py,R.t);
    if(R.bar){const n=72;g.fillStyle='#c4ffe3';
      for(let i=0;i<n;i++){const an=i/n*TAU;g.globalAlpha=((i+((R.t*10)|0))%3===0)?0.95:0.45;px2(g,px+Math.cos(an)*44,py+Math.sin(an)*46);}
      g.globalAlpha=1;}
  }
  for(const d of R.D)DS(g,DRONE,d.x,d.y);
  for(const a of R.A){const s=ALLY[a.vx>0?0:1];DS(g,s,a.x,a.y);
    const f=((R.t*20)|0)%2;g.fillStyle='#ffb032';g.fillRect(Math.round(a.x)-(a.vx>0?20+f*2:-16),Math.round(a.y)-1,3+f*2,3);g.fillStyle='#fff2a8';g.fillRect(Math.round(a.x)-(a.vx>0?18:-16),Math.round(a.y),2,1);}
  for(const b of R.B){
    const sp=Math.hypot(b.vx,b.vy)||1,ux=b.vx/sp,uy=b.vy/sp;
    switch(b.k){
      case 1:for(let k=4;k>=0;k--){g.fillStyle=k<1?'#ffffff':k<3?'#5dffb0':'#1f8a5a';px3(g,b.x-ux*k*2,b.y-uy*k*2);}break;
      case 2:{const q=1-b.life/b.max,s=Math.round(3+q*7);g.globalAlpha=Math.max(0.15,1-q*0.85);g.fillStyle=q<0.25?'#ffffff':q<0.6?'#6af0ff':'#2f7fb8';
        g.fillRect(Math.round(b.x)-(s>>1),Math.round(b.y)-(s>>1),s,s);g.globalAlpha=1;break;}
      case 3:g.fillStyle='#5aaedc';px3(g,b.x-ux*4,b.y-uy*4);g.fillStyle='#e9f8ff';g.fillRect(Math.round(b.x)-1,Math.round(b.y)-3,3,6);g.fillRect(Math.round(b.x)-3,Math.round(b.y)-1,6,3);g.fillStyle='#ffffff';g.fillRect(Math.round(b.x),Math.round(b.y),1,1);break;
      case 4:for(let k=4;k>=0;k--){g.fillStyle=k<2?'#ffffff':'#b8bce0';px3(g,b.x-ux*k*2,b.y-uy*k*2);}break;
      case 5:g.fillStyle='#4588f2';px2(g,b.x-ux*3,b.y-uy*3);g.fillStyle='#e3eaff';px3(g,b.x,b.y);break;
      case 6:g.fillStyle='#ffcd48';px3(g,b.x,b.y);g.fillStyle='#ffffff';g.fillRect(Math.round(b.x),Math.round(b.y),1,1);break;
      default:for(let k=6;k>=0;k--){g.fillStyle=k<2?'#ffffff':k<4?'#4adcf6':'#168fb8';px3(g,b.x-ux*k*2,b.y-uy*k*2);}
    }
  }
  for(const ms of R.M)DS(g,MISS[((Math.round(ms.a/(Math.PI/8))%16)+16)%16],ms.x,ms.y);
  for(const l of R.L){const k=1-l.t/0.3;if(k<=0)continue;
    g.save();g.translate(l.x,l.y);g.rotate(Math.atan2(l.uy,l.ux));
    g.globalAlpha=k*0.45;g.fillStyle='#18b0b4';g.fillRect(0,-l.w*k/2-4,l.len,l.w*k+8);
    g.globalAlpha=k*0.8;g.fillStyle='#5cffef';g.fillRect(0,-l.w*k/2,l.len,l.w*k);
    g.globalAlpha=k;g.fillStyle='#e0fffb';g.fillRect(0,-l.w*k/4,l.len,Math.max(1,l.w*k/2));g.restore();g.globalAlpha=1;}
  for(const z of R.Z){
    if(((z.t*40)|0)%3===2)continue;
    for(let i=1;i<z.poly.length;i++){const [ax,ay]=z.poly[i-1],[bx,by]=z.poly[i],n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)/1.5));
      for(let s=0;s<=n;s++){const x=ax+(bx-ax)*s/n,y=ay+(by-ay)*s/n;g.fillStyle='#a4c41c';px3(g,x,y);g.fillStyle='#fbffd0';g.fillRect(Math.round(x),Math.round(y),1,1);}}
  }
  for(const x of R.X){const fr=x.f[Math.min(x.f.length-1,Math.floor(x.t/x.dur*x.f.length))];g.drawImage(fr,Math.round(x.x)-(fr.width>>1),Math.round(x.y)-(fr.height>>1));}
  for(const p of R.P){g.globalAlpha=clamp(p.life/p.max*1.4,0,1)*0.9;g.fillStyle=p.c;g.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}
  g.globalAlpha=1;
  const ebf=EBS[((R.t*8)|0)%2];
  for(const b of R.EB){g.drawImage(EBG,Math.round(b.x)-16,Math.round(b.y)-16);}
  for(const b of R.EB)DS(g,ebf,b.x,b.y);
  if(R.state!=='over'){const w=40,r=R.hp/R.maxHp;g.fillStyle='#060a1c';g.fillRect(px-21,py+45,w+2,6);g.fillStyle='#2a1030';g.fillRect(px-20,py+46,w,4);
    g.fillStyle=r>0.35?'#5dffb0':'#ff2d6f';g.fillRect(px-20,py+46,Math.ceil(w*r),4);}
  const boss=R.E.find(e=>e.kind==='boss');
  if(boss){g.fillStyle='#060a1c';g.fillRect(34,6,GW-68,8);g.fillStyle='#2a1030';g.fillRect(36,8,GW-72,4);g.fillStyle='#e0304f';g.fillRect(36,8,Math.ceil((GW-72)*Math.max(0,boss.hp/boss.max)),4);}
  if(R.hurtFx>0){g.fillStyle='rgba(255,45,111,0.2)';g.fillRect(0,0,GW,GH);}
}
function hud(){
  const lv='LV '+R.lv;if(hc.lv!==lv){hc.lv=lv;$('hudLv').textContent=lv;}
  const tm=fmt(R.t);if(hc.t!==tm){hc.t=tm;$('hudTime').textContent=tm;}

function frame(ts){
  if(!R)return;
  raf=requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0;dt=Math.min(dt,0.05);
  if(R.state==='play')update(dt);
  if(R){draw();hud();}
}

/* ---------- level-up screen ---------- */
function buildChoices(){
  const pool=[];
  TYPES.forEach(t=>{const lv=R.tlv[t],m=MODS[t];
    if(lv>0&&lv<WMAX)pool.push({w:3,c:m.c,icon:{img:ICON[t]},name:m.name,tag:'武器',lv,max:WMAX,desc:m.up[lv+1],fn:()=>{R.tlv[t]++;}});
  });
  Object.keys(PAS).forEach(k=>{const p=PAS[k],lv=R.pas[k];if(lv<p.max)pool.push({w:1,c:p.c,icon:{img:PICON[k]},name:p.name,tag:'機体',lv,max:p.max,desc:p.desc,
    fn:()=>{R.pas[k]++;if(k==='armor'){R.maxHp+=20;R.hp=Math.min(R.maxHp,R.hp+20);}}});});
  Object.keys(SUP).forEach(k=>{const s=SUP[k],lv=R.sup[k];if(lv>=s.max)return;
    const desc=lv===0?s.first:(lv+1===s.max&&s.last)?s.last:s.more;
    pool.push({w:(lv===0?1.3:1.1)*(R.sh.carrier?2:1),c:s.c,icon:SICON[k]?{img:SICON[k]}:{ch:s.ic},name:s.name,tag:lv?'支援':'支援・新',lv,max:s.max,desc,
      fn:()=>{R.sup[k]++;if(k==='wing'&&lv===0)R.wingT=1.5;if(k==='strike'&&lv===0)R.strikeT=1;if(k==='barrier'&&lv===0)R.bar=true;}});});
  const out=[];
  while(out.length<3&&pool.length){let tot=0;pool.forEach(o=>{tot+=o.w;});let r=Math.random()*tot,i=0;
    for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break;}out.push(pool.splice(i,1)[0]);}
  while(out.length<3)out.push({c:'#7af7d9',icon:{img:PICON.regen},name:'修理',tag:'回復',lv:-1,max:0,desc:'HPを40回復',fn:()=>{R.hp=Math.min(R.maxHp,R.hp+40);}});
  return out;
}
function iconEl(icon,cls){const s=el('span',cls);if(icon.img){const im=el('img');im.alt='';im.src=icon.img;s.appendChild(im);}else s.textContent=icon.ch;return s;}
function buildSummary(){
  const wrap=el('div','build'),ul=el('ul');
  const add=(c,icon,lvTxt)=>{const li=el('li');li.style.setProperty('--c',c);li.append(iconEl(icon,icon.img?null:'ch'),el('b',null,lvTxt));ul.appendChild(li);};
  TYPES.forEach(t=>{if(R.tlv[t]>0)add(MODS[t].c,{img:ICON[t]},'LV'+R.tlv[t]);});
  Object.keys(PAS).forEach(k=>{if(R.pas[k]>0)add(PAS[k].c,{img:PICON[k]},'LV'+R.pas[k]);});
  Object.keys(SUP).forEach(k=>{if(R.sup[k]>0)add(SUP[k].c,SICON[k]?{img:SICON[k]}:{ch:SUP[k].ic},'LV'+R.sup[k]);});
  wrap.append(el('p',null,'いまの強化（HP '+Math.ceil(R.hp)+' / '+R.maxHp+'）'),ul);
  return wrap;
}
let lvChoices=null;
function openLevelUp(){
  SFX.play('lvup');
  R.state='lvup';sdrag=null;R.target=null;
  overlay.textContent='';
  const wrap=el('div','cards');
  lvChoices=buildChoices();
  lvChoices.forEach(o=>{
    const b=el('button','card');b.type='button';b.disabled=true;b.style.setProperty('--c',o.c);
    const body=el('span','cbody'),top=el('span','ctop');
    top.append(el('b',null,o.name),el('em',null,o.tag));body.appendChild(top);
    if(o.max>0){const pips=el('span','pips');for(let i=0;i<o.max;i++)pips.appendChild(el('i',i<o.lv?'on':i===o.lv?'nx':null));
      pips.appendChild(el('small',null,o.lv===0?'NEW':'LV'+o.lv+'→'+(o.lv+1)));body.appendChild(pips);}
    body.appendChild(el('span','d',o.desc));
    b.append(iconEl(o.icon,'ic'),body);

    wrap.appendChild(b);
  });
  overlay.append(el('h2',null,'レベルアップ！'),el('p','sub','Lv '+(R.lv-R.pending+1)+' ・ ひとつえらんでね'),wrap,buildSummary());

function pickChoice(o){if(!R||R.state!=='lvup')return;lvChoices=null;o.fn();R.pending--;if(R.pending>0)openLevelUp();else resume();}
function resume(){if(!R)return;overlay.hidden=true;R.state='play';last=performance.now();}
function openPause(){
  if(!R||R.state!=='play')return;
  R.state='pause';sdrag=null;R.target=null;overlay.textContent='';
  const row=el('div','btnrow'),c=el('button','go','続ける'),q=el('button','btn2','撤退して格納庫へ');
  c.type='button';q.type='button';c.addEventListener('click',resume);q.addEventListener('click',()=>endRun(false,true));
  const sb=el('button','btn2',save.snd===false?'音 OFF':'音 ON');sb.type='button';sb.addEventListener('click',()=>{save.snd=save.snd===false;persist();sb.textContent=save.snd===false?'音 OFF':'音 ON';});
  row.append(c,sb,q);
  overlay.append(el('h2',null,'一時停止'),el('p','sub',fmt(R.t)+' ・ 撃破 '+R.kills+'体 ・ Lv '+R.lv),buildSummary(),row);
  overlay.hidden=false;
}
function endRun(clear,retreat){
  if(!R||R.state==='over')return;
  R.state='over';sdrag=null;
  const gk=Math.floor(R.kills/2),gt=Math.floor(R.t/2),gb=R.bossKills*50,gc=clear?300:0,base=gk+gt+gb+gc;
  const gi=Math.floor(base*((1+0.15*R.pas.gold+R.bonus.gold)*R.sh.gold-1)),total=base+gi;
  save.gold+=total;
  /* 記録（機体の解放に使う） */
  const rc=save.rec;if(clear)rc.clears++;rc.bosses+=R.bossKills;rc.goldTotal+=total;
  TYPES.forEach(t=>{if(R.tlv[t]>(rc.wmax[t]||0))rc.wmax[t]=R.tlv[t];});
  Object.keys(SUP).forEach(k=>{if(R.sup[k]>=SUP[k].max&&!rc.sup5.includes(k))rc.sup5.push(k);});
  const newly=SHIP_IDS.filter(id=>!save.ships[id].have&&shipProg(id).ok&&!(save.seen||[]).includes(id));
  if(newly.length){save.seen=(save.seen||[]).concat(newly);}
  const rec={t:Math.floor(R.t),kills:R.kills,clear};let isBest=false;
  if(!save.best||rec.t>save.best.t||(rec.t===save.best.t&&rec.kills>save.best.kills)){save.best=rec;isBest=true;}
  persist();
  if(!retreat){SFX.play(clear?'clear':'over');if(clear)setTimeout(()=>SFX.play('coin'),900);}
  overlay.textContent='';
  overlay.append(el('h2',null,clear?'クリア！':retreat?'撤退':'撃墜…'),
    el('p','sub',clear?'5分 生きのびた！':retreat?'とちゅうで格納庫にもどったよ':'組みなおして、また出撃しよう'));
  if(isBest)overlay.appendChild(el('span','tagnew','新記録'));
  if(newly.length)overlay.appendChild(el('p','sub unl','新しい機体が解放された！ショップの「機体」で買えるよ：'+newly.map(id=>SHIPS[id].name).join('・')));
  const ul=el('ul','stats');
  const row=(k,v,cls)=>{const li=el('li',cls||null);li.append(el('span',null,k),el('b',null,v));ul.appendChild(li);};
  row('生きのびた時間',fmt(R.t));row('撃破',R.kills+'体');row('到達レベル','Lv '+R.lv);
  row('撃破ボーナス','+'+gk+'G');row('時間ボーナス','+'+gt+'G');
  if(gb)row('大型の敵','+'+gb+'G');if(gc)row('クリアボーナス','+'+gc+'G');if(gi)row('収入アップ','+'+gi+'G');
  row('かせいだお金','+'+total+'G','total');
  const btns=el('div','btnrow'),back=el('button','go','格納庫へ'),shop=el('button','btn2','ショップへ');back.type='button';shop.type='button';
  const toHangar=()=>{cancelAnimationFrame(raf);R=null;sortie.hidden=true;hangar.hidden=false;overlay.hidden=true;layoutEditor();renderAll();};
  back.addEventListener('click',()=>{toHangar();toast(total+'G かせいだよ');});
  shop.addEventListener('click',()=>{toHangar();openShop();});
  btns.append(back,shop);
  overlay.append(ul,btns);overlay.hidden=false;
}

  try{stage.setPointerCapture(e.pointerId);}catch(err){}

});
stage.addEventListener('pointermove',e=>{
  if(!sdrag||!R||e.pointerId!==sdrag.id||R.state!=='play')return;
  const k=1.25/scale;
  R.target={x:clamp(sdrag.px+(e.clientX-sdrag.sx)*k,PMX,GW-PMX),y:clamp(sdrag.py+(e.clientY-sdrag.sy)*k,PMY,GH-PMY)};
});
const endSDrag=e=>{if(sdrag&&e.pointerId===sdrag.id){sdrag=null;if(R)R.target=null;}};
stage.addEventListener('pointerup',endSDrag);stage.addEventListener('pointercancel',endSDrag);
$('pauseBtn').addEventListener('click',openPause);
const keyName=e=>e.key.length===1?e.key.toLowerCase():e.key;
window.addEventListener('keydown',e=>{
  if(!R)return;const k=keyName(e);
  if(R.state==='lvup'&&lvChoices&&['1','2','3'].includes(k)){const o=lvChoices[+k-1];if(o&&!overlay.querySelector('.card:disabled'))pickChoice(o);return;}
  if(k==='Escape'||k==='p'){if(R.state==='play')openPause();else if(R.state==='pause')resume();return;}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s'].includes(k)){keys.add(k);if(k.startsWith('Arrow'))e.preventDefault();}
});
window.addEventListener('keyup',e=>{keys.delete(keyName(e));});
window.addEventListener('blur',()=>keys.clear());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R&&R.state==='play')openPause();});

document.querySelectorAll('img.coin').forEach(i=>{i.src=COINURL;});
/* ---------- title・遊び方 ---------- */
const titleEl=$('title'),tCv=$('titleCv'),tg=tCv.getContext('2d');
let TS=null,tRaf=0,tLast=0;
function titleBg(){
  const r=titleEl.getBoundingClientRect(),h=clamp(Math.round(GW*Math.max(1,r.height)/Math.max(1,r.width)),660,1200);
  tCv.width=GW;tCv.height=h;tg.imageSmoothingEnabled=false;
  const stars=[];for(let i=0;i<170;i++)stars.push({x:rand(0,GW),y:rand(0,h),l:i<95?0:i<145?1:2,tw:rand(0,TAU)});
  TS={t:0,h,neb:rand(0,1024),stars,pl:{i:0,x:GW*0.02,y:h*0.4},shots:[],cd:0};
}
function titleFrame(ts){
  if(titleEl.hidden){tRaf=0;return;}
  tRaf=requestAnimationFrame(titleFrame);
  let dt=(ts-tLast)/1000;tLast=ts;if(!(dt>0))dt=0;dt=Math.min(dt,0.05);
  const S=TS,g=tg,h=S.h;S.t+=dt;
  for(const s of S.stars){s.y+=STAR_SP[s.l]*dt*1.6;if(s.y>h){s.y-=h;s.x=rand(0,GW);}}
  S.neb=(S.neb+12*dt)%NEB.height;S.pl.y+=9*dt;if(S.pl.y>h+10){S.pl.i=(S.pl.i+1)%PLANETS.length;S.pl.y=-PLANETS[S.pl.i].height-40;S.pl.x=rand(0,GW-PLANETS[S.pl.i].width);}
  const px=Math.round(GW/2+Math.sin(S.t*0.9)*70),py=Math.round(h*0.66+Math.sin(S.t*1.7)*14);
  S.cd-=dt;if(S.cd<=0){S.cd=0.16;S.shots.push({x:px-14,y:py-20},{x:px+14,y:py-20});}
  for(const b of S.shots)b.y-=600*dt;S.shots=S.shots.filter(b=>b.y>-20);
  const keep=R;R={t:S.t,neb:S.neb,pl:S.pl,stars:S.stars};
  const gh=GH;GH=h;drawBg(g);GH=gh;R=keep;
  for(const b of S.shots){for(let k=6;k>=0;k--){g.fillStyle=k<2?'#ffffff':k<4?'#4adcf6':'#168fb8';g.fillRect(b.x-1,Math.round(b.y+k*2)-1,3,3);}}
  const sp=SHIPSPR[save.cur],fl=sp.fl[((S.t*14)|0)%sp.fl.length];
  g.drawImage(fl,px-sp.cx,py-sp.cy);g.drawImage(sp.img,px-sp.cx,py-sp.cy);
}
function showTitle(){
  hangar.hidden=true;sortie.hidden=true;$('howto').hidden=true;titleEl.hidden=false;
  titleBg();renderSnd();if(!tRaf){tLast=performance.now();tRaf=requestAnimationFrame(titleFrame);}
}
function toHangarFromTitle(){titleEl.hidden=true;$('howto').hidden=true;hangar.hidden=false;view=save.cur;layoutEditor();renderAll();}
function renderSnd(){const b=$('sndBtn');b.textContent=save.snd===false?'音 OFF':'音 ON';b.setAttribute('aria-pressed',save.snd===false?'false':'true');}
$('sndBtn').addEventListener('click',()=>{save.snd=save.snd===false;persist();renderSnd();SFX.unlock();SFX.play('btn');});
$('startBtn').addEventListener('click',()=>{SFX.play('start');if(!save.howto)openHowto(true);else toHangarFromTitle();});
$('howBtn').addEventListener('click',()=>openHowto(false));
$('toTitle').addEventListener('click',showTitle);
window.addEventListener('resize',()=>{if(!titleEl.hidden)titleBg();});

/* 遊び方（絵つき4枚・1回目のスタートのときにも出す） */
const HOWTO=[
  {t:'指でなぞって動く',d:'画面のどこでも、指でなぞった方へ機体が動くよ。PCは矢印キーでもOK'},
  {t:'撃つのは自動',d:'つけた装備が、向いた方へ自動で撃つよ。よけることに集中しよう。5分生きのびたらクリア！'},
  {t:'レベルアップで強くなる',d:'敵をたおすと青い結晶が出るよ。集めてレベルアップしたら、3つから1つえらんで強くなる'},
  {t:'お金で買って組み合わせる',d:'出撃でかせいだお金で、装備と機体をショップで買えるよ。どこに・どの向きでつけるかは自由！'},
];
let howPage=0,howFirst=false;
function howArt(i){
  const c=document.createElement('canvas');c.width=160;c.height=110;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  g.fillStyle='#05060f';g.fillRect(0,0,160,110);g.drawImage(NEB,0,200,160,110,0,0,160,110);
  const sp=SHIPSPR.standard,DS2=(s,x,y)=>g.drawImage(s.img||s,Math.round(x-(s.w||s.width)/2),Math.round(y-(s.h||s.height)/2));
  const sh=(x,y,k)=>{g.save();g.translate(x,y);g.scale(k,k);g.drawImage(sp.fl[0],-sp.cx,-sp.cy);g.drawImage(sp.img,-sp.cx,-sp.cy);g.restore();};
  if(i===0){sh(64,60,0.75);g.fillStyle='#ffd23f';for(let k=0;k<5;k++)g.fillRect(88+k*7,74-k*3,4,3);
    g.drawImage(FINGER.img,118,64,24,30);g.fillStyle='#ffd23f';g.fillRect(122,56,12,3);g.fillRect(131,53,3,9);}
  if(i===1){sh(80,82,0.62);DS2(ESPR.bug,50,22);DS2(ESPR.bug,110,16);DS2(ESPR.shooter,82,20);
    for(const x of [70,90])for(let y=40;y<64;y+=9){g.fillStyle='#4adcf6';g.fillRect(x,y,3,6);g.fillStyle='#fff';g.fillRect(x+1,y,1,2);}}
  if(i===2){[[40,50],[60,64],[50,82],[76,44]].forEach(([x,y])=>DS2(GEMS,x,y));DS2(GEMB,70,78);
    g.fillStyle='#14163a';g.fillRect(96,20,56,72);g.strokeStyle='#ffd23f';g.lineWidth=2;g.strokeRect(97,21,54,70);
    g.fillStyle='#5aa2ff';for(let k=0;k<3;k++){g.fillRect(104,32+k*20,10,10);g.fillStyle=k?'#2e3277':'#ffd23f';g.fillRect(118,35+k*20,26,4);g.fillStyle='#5aa2ff';}
    g.fillStyle='#ffd23f';g.fillRect(16,30,10,4);g.fillRect(19,24,4,16);}
  if(i===3){sh(52,58,0.7);DS2(MISC.coin,110,22);DS2(MISC.coin,126,30);DS2(MISC.coin,98,32);
    DS2(MSPR.missile[0],104,66);DS2(MSPR.shield[0],132,66);DS2(MSPR.sword[1],118,92);g.fillStyle='#ffd23f';g.fillRect(84,60,8,3);g.fillRect(84,60,3,3);}
  return c;
}
function renderHowto(){
  const box=$('howCard'),p=HOWTO[howPage];box.textContent='';
  const art=howArt(howPage);art.className='howart';art.setAttribute('aria-hidden','true');
  box.append(el('p','howno num',(howPage+1)+' / '+HOWTO.length),art,el('h3',null,p.t),el('p',null,p.d));
  const dots=el('div','howdots');HOWTO.forEach((_,k)=>dots.appendChild(el('i',k===howPage?'on':null)));box.appendChild(dots);
  $('howPrev').disabled=howPage===0;
  $('howNext').textContent=howPage<HOWTO.length-1?'次へ':howFirst?'はじめる':'とじる';
}
function openHowto(first){howFirst=first;howPage=0;$('howto').hidden=false;renderHowto();}
$('howPrev').addEventListener('click',()=>{if(howPage>0){howPage--;renderHowto();}});
$('howNext').addEventListener('click',()=>{
  if(howPage<HOWTO.length-1){howPage++;renderHowto();return;}
  save.howto=1;persist();$('howto').hidden=true;if(howFirst)toHangarFromTitle();
});
/* 最初のタップで音を始める・ボタンの音 */
document.addEventListener('pointerdown',()=>SFX.unlock(),{capture:true});
document.addEventListener('click',e=>{SFX.unlock();const b=e.target.closest&&e.target.closest('button');if(!b||b.disabled)return;
  if(b.id==='startBtn'||b.id==='sndBtn'||b.classList.contains('buybig'))return;SFX.play('btn');},{capture:true});

document.querySelectorAll('.gname').forEach(e=>{e.textContent=GAME_NAME;});
layoutEditor();renderAll();showTitle();
})();
</script>
