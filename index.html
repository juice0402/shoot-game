<title>シューティング×ヴァンサヴァ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* Layout: one phone screen. Hangar = header / ship bay (fills) / selected-slot bar / module tray (scrolls sideways) / launch. Shop = full-screen panel: tabs, item grid, detail + buy. Sortie = HUD strip + pixel canvas. Single dark look on purpose (space game). */
:root{
  --void:#0a0b1c; --deep:#05060f; --panel:#14163a; --panel-2:#1d2052; --edge:#2e3277;
  --ink:#eceaff; --dim:#9498d0; --scrim:rgba(5,6,15,.9);
  --go:#ffd23f; --go-ink:#2b1d00; --go-sh:#a7791a; --hurt:#ff2d6f;
  --f-ui:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Press Start 2P","DotGothic16",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #4cc9ff;outline-offset:2px}
button:disabled{cursor:not-allowed}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- title・遊び方 ---------- */
#title{position:fixed;inset:0;z-index:30;background:var(--deep);overflow:hidden}
#titleCv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}
.tbox{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(14vh + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.logo{margin:0;text-align:center;font-family:var(--f-num);font-weight:400;font-size:clamp(30px,10vw,46px);line-height:1.25;letter-spacing:.04em;color:#fff2a8;
  text-shadow:0 3px 0 #b8600e,0 6px 0 #6e3006,0 0 18px rgba(255,205,72,.55)}
.logo small{display:block;margin-top:14px;font-family:var(--f-ui);font-size:15px;letter-spacing:.12em;color:#cfeaff;text-shadow:0 2px 0 #060a1c}
.tbtns{display:flex;flex-direction:column;gap:10px}
.tbtns .hrow button{flex:1}
.btn3.sq{width:44px;min-height:44px;padding:0;flex:none;display:grid;place-items:center}
/* ◀ ▶ ✕ と向きの矢印（#16）：文字の記号ではなく、点で描いた小さな絵（pixIcon） */
.pix{display:block;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
.howbg{position:fixed;inset:0;z-index:70;background:rgba(5,6,15,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.howbox{width:100%;max-width:400px;background:var(--panel);border:3px solid var(--go);padding:14px;display:flex;flex-direction:column;gap:12px}
.howcard{display:flex;flex-direction:column;gap:8px;text-align:center}
.howcard h3{margin:0;font-weight:400;font-size:22px;color:var(--go)}
.howcard p{margin:0;font-size:15px;line-height:1.6}
.howno{color:var(--dim);font-size:14px!important}
.howart{width:100%;aspect-ratio:160/110;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--edge)}
.howdots{display:flex;justify-content:center;gap:8px}
.howdots i{width:9px;height:9px;background:var(--edge)}
.howdots i.on{background:var(--go)}
.howbox .hrow button:first-child{flex:none;width:30%}

/* ---------- hangar（スマホ1画面：上＝お金とショップ／まんなか＝大きな機体／下＝出撃） ---------- */
#hangar{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:22px;line-height:1.2;font-weight:400;letter-spacing:.08em}
h1 small{font-size:14px;color:var(--dim);letter-spacing:.04em;margin-left:6px}
@media (max-width:430px){h1 small{display:none}}
.gold{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--panel);border:3px solid var(--edge);flex:none}
.coin{width:16px;height:16px;image-rendering:pixelated;image-rendering:crisp-edges}
.gold b{font-size:14px;font-weight:400}
.gold small{color:var(--dim);font-size:14px}
.shopbtn{position:relative;flex:none;height:44px;padding:0 14px;background:var(--panel);border:3px solid var(--edge);font-size:16px}/* 11/16：いつも黄色いわくだったのをやめて、研究所と同じに（しょーくん） */
.bay{flex:1;min-height:250px;position:relative;background:var(--deep);border:3px solid var(--edge);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#editor{position:absolute;inset:0;width:100%;height:100%;display:block}
.shipcap{position:absolute;left:52px;right:52px;top:6px;margin:0;text-align:center;pointer-events:none;line-height:1.3}
.shipcap b{display:block;font-size:20px;font-weight:400;letter-spacing:.06em}
.shipcap small{display:block;font-size:14px;color:var(--dim)}
.navb{position:absolute;top:50%;z-index:3;width:44px;height:72px;margin-top:-36px;background:rgba(20,22,58,.88);border:3px solid var(--edge);display:grid;place-items:center;padding:0}
#shipPrev{left:4px}#shipNext{right:4px}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;pointer-events:none}
.dots i{width:9px;height:9px;background:var(--edge)}
.dots i.on{background:var(--ink)}
.slots{position:absolute;inset:0;z-index:2;pointer-events:none}
.slotb{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:transparent;border:0;pointer-events:auto;padding:0}
.slotb.empty{border:3px dashed #8fd0ff;background:rgba(10,30,70,.55);color:#cfeaff;font-size:24px;line-height:1}
.slotb.full:active{background:rgba(255,255,255,.15)}
.lockbox{position:absolute;left:52px;right:52px;bottom:26px;z-index:3;background:var(--scrim);border:3px solid var(--edge);padding:8px 10px;text-align:center;font-size:14px;line-height:1.4}
.lockbox p{margin:0}
.prog{height:12px;background:var(--panel);border:2px solid var(--edge);margin:6px 0}
.prog i{display:block;height:100%;background:var(--go)}
.lockbox .btn3{margin-top:6px;width:100%}
/* はじめの案内：押す所だけ明るく、ほかは暗くする。ほかの所は押せない。指は押す所に向かって動く */
.tutdim{position:fixed;inset:0;z-index:65;pointer-events:none}
.tutdim .hole{position:absolute;box-shadow:0 0 0 200vmax rgba(3,4,10,.72);pointer-events:none}
.tutdim .blk{position:absolute;pointer-events:auto;touch-action:none}
.tfinger{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;translate:-50% 0;pointer-events:none;--bob:-8px;animation:tbob .8s ease-in-out infinite}
.tfinger img{width:32px;height:40px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 #000)}
.tfinger b{font-weight:400;font-size:14px;background:var(--go);color:var(--go-ink);padding:2px 8px;white-space:nowrap}
.tfinger.down{flex-direction:column-reverse;--bob:8px}
.tfinger.down img{transform:scaleY(-1);filter:drop-shadow(0 -2px 0 #000)}
@keyframes tbob{50%{transform:translateY(var(--bob))}}
.toast{position:absolute;left:8px;right:8px;bottom:26px;z-index:5;margin:0 auto;width:max-content;max-width:calc(100% - 16px);padding:4px 10px;background:var(--scrim);border:2px solid var(--go);color:var(--go);font-size:14px;text-align:center;pointer-events:none}
.hrow{display:flex;gap:8px}
/* ステージのえらび方（#13）：出撃の上に1行。左右の矢印は点の絵（#16） */
.stsel{display:flex;align-items:center;gap:6px;min-height:58px;padding:4px;background:var(--panel);border:3px solid var(--edge)}
.stnav{flex:none;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--panel-2);border:3px solid var(--edge)}
.stnav:disabled{opacity:.3}
.stinfo{flex:1;min-width:0;text-align:center;line-height:1.3}
.stname{margin:0;display:flex;align-items:baseline;justify-content:center;gap:8px}
.stname b{font-weight:400;font-size:18px;letter-spacing:.04em}
.stname small{font-size:14px;color:var(--dim)}
.stname img{width:14px;height:16px;align-self:center;image-rendering:pixelated;image-rendering:crisp-edges}
.stdesc{margin:0;font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stsel.locked .stname b{color:var(--dim)}
.btn3{min-height:48px;padding:0 14px;background:var(--panel-2);border:3px solid var(--edge);font-size:15px}
.go{flex:1;display:block;width:100%;min-height:58px;padding:10px;font-size:21px;letter-spacing:.2em;background:var(--go);color:var(--go-ink);border:0;box-shadow:inset 0 -5px 0 var(--go-sh),inset 0 3px 0 rgba(255,255,255,.45)}
.go:active{transform:translateY(2px);box-shadow:inset 0 -3px 0 var(--go-sh)}
.go:disabled{background:var(--panel-2);color:var(--dim);box-shadow:none;letter-spacing:.04em;font-size:16px}

/* 下から出る板（装備の一覧・向き・くわしく・ショップのくわしく） */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(5,6,15,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;max-height:82%;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:3px solid var(--c,var(--edge));border-bottom:0;
  padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px;min-height:44px}
.sheet h3 small{font-size:14px;color:var(--dim)}
.sheet .x{margin-left:auto;flex:none;width:44px;height:44px;padding:0;background:var(--panel-2);border:3px solid var(--edge);display:grid;place-items:center}
.sheet p{margin:0;font-size:14px;line-height:1.5}
.sheet .dim{color:var(--dim)}
.irow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;min-height:62px;padding:6px 10px;background:var(--panel-2);border:3px solid var(--edge);text-align:left;width:100%}
.irow img{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges}
.irow b{display:block;font-size:16px;font-weight:400;line-height:1.3}
.irow small{display:block;font-size:14px;color:var(--dim);line-height:1.35}
.irow em{font-style:normal;font-size:14px;color:var(--ink);white-space:nowrap}
.irow:disabled{opacity:.45}
.irow.now{border-color:var(--go)}
.dirs{display:grid;grid-template-columns:repeat(3,68px);grid-auto-rows:68px;gap:8px;justify-content:center}
.dirs button{padding:0;display:grid;place-items:center;background:var(--panel-2);border:3px solid var(--edge)}
.dirs button[aria-pressed="true"]{border-color:var(--go);background:#2a2a5a}
.dirs .mid{display:grid;place-items:center;background:var(--deep);border:3px solid var(--edge)}
.dirs .mid img{width:56px;height:56px;image-rendering:pixelated;image-rendering:crisp-edges}
.sbtns{display:flex;gap:8px}
.sbtns button{flex:1}
.btn3.warn{border-color:var(--hurt);color:#ffb0c4}
.statl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.statl li{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;background:var(--panel-2);font-size:14px}
.statl li b{font-weight:400;color:var(--go)}

/* ---------- shop（2列の大きなカード → タップでくわしく） ---------- */
.shopx{position:fixed;inset:0;z-index:40;background:var(--void);display:flex;flex-direction:column;gap:8px;
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shopx>*{width:100%;max-width:460px;margin-inline:auto}
.shead{display:flex;align-items:center;gap:8px;min-height:44px}
.shead h2{flex:1;margin:0;font-weight:400;font-size:22px;letter-spacing:.08em}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stabs button{position:relative;min-height:46px;background:var(--panel);border:3px solid var(--edge);font-size:16px}
.stabs button[aria-selected="true"]{border-color:var(--go);color:var(--go);background:var(--panel-2)}
.sgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;padding:2px;overscroll-behavior:contain}
.sitem{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:138px;padding:10px 6px;background:var(--panel);border:3px solid var(--edge);border-bottom:6px solid var(--c);min-width:0}
.sitem img{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain}
.sitem span{font-size:15px;line-height:1.3;text-align:center;max-width:100%}
.sitem small{font-size:14px;color:var(--go);line-height:1.3}
.sitem small.short{color:var(--dim)}
.sitem i{position:absolute;top:4px;right:4px;font-style:normal;font-size:14px;line-height:1;color:var(--ink);background:var(--edge);padding:4px 6px}
.soonh{grid-column:1/-1;margin:10px 0 0;font-weight:400;font-size:16px;color:var(--dim)}
.lockc{grid-column:1/-1;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;background:var(--scrim);border:3px solid var(--edge);padding:8px 10px;font-size:14px;line-height:1.4}
.lockc img{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain}
.lockc p{margin:0}
.lockc .prog{margin:4px 0}
.soonn{grid-column:1/-1;margin:0;text-align:center;font-size:14px;color:var(--dim)}
.dbgrow{display:flex;flex-wrap:wrap;gap:6px}
.dbgrow .linkbtn{flex:1 1 200px;width:auto}
.dtop{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.dtop img{width:76px;height:76px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain;background:var(--deep);border:3px solid var(--c)}
.dtop b{font-weight:400;font-size:19px;line-height:1.3}
.cat{display:inline-block;margin-left:8px;padding:0 6px;font-size:14px;background:var(--c);color:var(--deep);vertical-align:2px}
.dtop p{margin:4px 0 0;font-size:14px;color:var(--dim);line-height:1.5}
.drate{display:flex;flex-direction:column;gap:6px;font-size:14px}
.rt{display:grid;grid-template-columns:3.5em 1fr;align-items:center;gap:8px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.bars i{height:12px;background:var(--edge)}
.bars i.on{background:var(--c)}
.eff{margin:0;font-size:15px}
.eff span{color:var(--dim)}
.own{font-size:14px;color:var(--dim)}
.own b{font-weight:400;color:var(--ink)}
.buybig{width:100%;min-height:56px;padding:10px 14px;font-size:18px;background:var(--go);color:var(--go-ink);border:0;box-shadow:inset 0 -5px 0 var(--go-sh)}
.buybig:disabled{background:var(--panel-2);color:var(--dim);box-shadow:none;font-size:16px}
.snote{margin:0;min-height:1.4em;font-size:14px;color:var(--go);text-align:center}
.linkbtn{background:none;border:2px dashed var(--edge);color:var(--dim);min-height:44px;width:100%;font-size:14px}
.btn2{min-height:48px;padding:12px;background:var(--panel);border:3px solid var(--edge);font-size:15px}
.btn2.small{min-height:44px;padding:4px 12px;font-size:15px}

/* ---------- sortie ---------- */
#sortie{height:100%;display:flex;flex-direction:column;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{display:flex;flex-direction:column;gap:6px;padding-block:8px 6px}
.xpbar{height:8px;background:var(--panel);border:2px solid var(--edge)}
.xpbar i{display:block;height:100%;width:0;background:#5aa2ff}
.hudrow{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;font-size:13px}
#hudLv{font-size:10px}
.clock{text-align:center;white-space:nowrap}
.clock b{font-size:14px;font-weight:400}
.clock small{font-size:8px;color:var(--dim);margin-left:4px}
.kills{text-align:right;white-space:nowrap}
.kills b{font-family:var(--f-num);font-size:10px;font-weight:400}
#pauseBtn{width:42px;height:34px;background:var(--panel);border:3px solid var(--edge);display:flex;gap:4px;align-items:center;justify-content:center}
#pauseBtn i{width:4px;height:12px;background:var(--ink);display:block}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding-bottom:6px}
.spbar{display:flex;align-items:center;gap:8px;width:100%;max-width:300px;margin:0 auto;padding-bottom:8px;font-size:11px;color:var(--dim)}
.spbar b{font-weight:400;white-space:nowrap}
.spbar span{flex:1;height:8px;background:var(--panel);border:2px solid var(--edge)}
.spbar i{display:block;height:100%;width:0;background:var(--c,#5aa2ff)}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--deep);box-shadow:0 0 0 3px var(--edge)}
.banner{position:absolute;left:50%;top:24%;transform:translateX(-50%);padding:8px 14px;background:var(--scrim);border:3px solid var(--hurt);font-size:15px;white-space:nowrap;pointer-events:none}
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;gap:12px;padding-block:20px;overflow-y:auto}
.overlay>:first-child{margin-top:auto}
.overlay>:last-child{margin-bottom:auto}
.overlay h2{margin:0;text-align:center;font-weight:400;font-size:26px;letter-spacing:.08em}
.overlay .sub{margin:0 auto;max-width:460px;text-align:center;color:var(--dim);font-size:13px}
.overlay .sub.unl{color:var(--go);font-size:14px}
/* 出撃の結果の「解放」（#16）：アイコンと名前を小さく並べる（6こでもボタンが1画面に入るように） */
.unlb{margin:0 auto;max-width:420px;width:100%;display:flex;flex-direction:column;gap:4px}
.unlb p{margin:0;text-align:center;font-size:14px;color:var(--go)}
.unll{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.unll li{display:flex;align-items:center;gap:4px;padding:1px 8px 1px 1px;background:var(--panel);border:2px solid var(--edge);font-size:13px;line-height:1.3;white-space:nowrap}
.unll img{width:24px;height:24px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain}
/* エンディング（#13） */
.endt{margin:0;text-align:center;font-size:clamp(28px,9vw,40px);line-height:1.3;letter-spacing:.3em;text-indent:.3em;color:#fff2a8}
.endh{margin:8px 0 0;text-align:center;font-weight:400;font-size:16px}
.overlay.endg .go{flex:none;max-width:320px;margin-inline:auto}
.cards{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;margin:0 auto}
.card{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:left;padding:10px 12px;background:var(--panel);border:3px solid var(--c,var(--edge));box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.card:disabled{opacity:.55;cursor:wait}
.card .ic{width:48px;height:48px;display:grid;place-items:center;background:var(--deep);border:2px solid var(--c,var(--edge));font-size:22px;color:var(--c,var(--ink))}
.card .ic img{width:42px;height:42px;image-rendering:pixelated}
.cbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctop b{font-weight:400;font-size:17px;line-height:1.3}
.ctop em{font-style:normal;font-size:11px;color:var(--deep);background:var(--c,var(--go));padding:0 6px}
.pips{display:flex;align-items:center;gap:3px}
.pips i{width:12px;height:6px;background:var(--edge)}
.pips i.on{background:var(--c)}
.pips i.nx{background:#ffffff}
.pips small{font-family:var(--f-num);font-size:8px;color:var(--dim);margin-left:6px}
.card .d{font-size:13px;color:var(--dim);line-height:1.4}
.card.evo{border-width:4px;background:#1c1838}
.card .d2{font-size:12px;color:var(--ink);line-height:1.3}

.overlay{overflow-x:hidden}

.fxghost>:not(.cards){animation:fxFade .18s ease-out both}
.fxghost .card{position:relative}
.fxghost .card.fxout{animation:fxCardOut .24s cubic-bezier(.55,0,.8,.2) both;animation-delay:var(--d,0s)}
.fxghost .card.fxgot{z-index:1;animation:fxCardGot .42s ease-out both;animation-delay:var(--d,0s)}
.fxghost .card.fxgot::after{content:'';position:absolute;inset:-3px;border:3px solid #fff;pointer-events:none;animation:fxRing .42s ease-out both;animation-delay:var(--d,0s)}
@keyframes fxScrim{to{background-color:transparent}}
@keyframes fxFade{to{opacity:0}}
@keyframes fxCardOut{to{transform:translateX(72%);opacity:0}}
@keyframes fxCardGot{0%{transform:none}18%{transform:scale(1.07);filter:brightness(2)}40%{transform:scale(.99);filter:brightness(1.25)}68%{transform:scale(1.01);opacity:1;filter:none}100%{transform:translateY(-14px) scale(1.02);opacity:0}}
@keyframes fxRing{0%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.1,1.5)}}
.bay.fxshake{animation:fxShake .16s steps(4,end) both}
@keyframes fxShake{0%{transform:translate(2px,1px)}25%{transform:translate(-2px,0)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}100%{transform:none}}

@keyframes fxRing2{0%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.18)}}

/* 炎：白→黄→オレンジ→赤の段（ゆらゆら4コマ） */
function flameFrames(w,h,list,extra){
  const cols=['#fffff0','#ffec8c','#ffb032','#f0601e','#aa2828'];
  return [0,2,4,1].map(t=>{const c=document.createElement('canvas');c.width=w+4;c.height=h+4+extra;const g=c.getContext('2d');
    for(const [x0,x1,top,ln] of list){const L=ln+t,cx=(x0+x1)/2;
      for(let y=top;y<top+L;y++){const k=(y-top)/L,hw=(x1-x0+1)*(1-k*0.8)/2;
        for(let x=x0;x<=x1;x++){if(Math.abs(x-cx)>hw)continue;const ci=Math.min(4,Math.floor(k*4+Math.abs(x-cx)/(hw+.01)*1.5));g.fillStyle=cols[ci];g.fillRect(x+2,y+2,1,1);}}}
    return c;});
}
function makeShip(id){const d=SHIP_PARTS[id];const s=paint(d.w,d.h,d.parts,{spec:d.spec});s.fl=flameFrames(d.w,d.h,d.flames,6);return s;}

/* 研究所の「増設」：全機体の後ろ（いちばん後ろの場所より13下）に場所を1つ足す。装備の配列の長さもそろえる */
const XSLOT={};
function ensureSlots(s){const on=!!(s&&s.lab&&s.lab.r_slot>0);
  SHIP_IDS.forEach(id=>{const sl=SHIPS[id].slots,has=sl.length&&sl[sl.length-1].x12;
    if(on&&!has){if(!XSLOT[id]){const y=Math.max(...sl.map(v=>v.y))+13;XSLOT[id]=Object.assign(SL('増設',0,y,4),{x12:1});}sl.push(XSLOT[id]);}

  const P=6,l=Math.round(r.left-P),t=Math.round(r.top-P),w=Math.round(r.width+P*2),h=Math.round(r.height+P*2),W=innerWidth,H=innerHeight;
  const f=$('tfinger'),fh=f.offsetHeight||64,down=t+h+fh+12>H,key=l+','+t+','+w+','+h+','+W+','+H+','+down;

function fxRestart(e,c){e.classList.remove(c);void e.offsetWidth;e.classList.add(c);}
/* 11/16 作りこみ4：数字をかぞえ上げる（「4:20」は秒で・「+120G」「2200体」「Lv 19」は数の所だけ）。delay のあと ms かけて、さいごは元の文字にもどす */
function countUp(e,delay,ms){
  if(RM()||!e)return;const txt=e.textContent,tm=/^(\d+):(\d\d)$/.exec(txt.trim());if(!tm&&!/\d/.test(txt))return;
  const tot=tm?(+tm[1])*60+(+tm[2]):0,t0=performance.now()+delay;
  const show=p=>{if(tm){const v=Math.round(tot*p);e.textContent=Math.floor(v/60)+':'+String(v%60).padStart(2,'0');}else e.textContent=txt.replace(/\d+/g,m=>String(Math.round(+m*p)));};
  show(0);const step=()=>{if(!e.isConnected)return;const p=Math.min(1,Math.max(0,(performance.now()-t0)/ms));if(p>=1){e.textContent=txt;return;}show(1-Math.pow(1-p,3));requestAnimationFrame(step);};requestAnimationFrame(step);
}
/* お金の数を前の数から新しい数へ動かす（買ったとき） */
function rollNum(e,from,to,ms){if(RM()||!e||from===to)return;const t0=performance.now();ms=ms||360;
  const step=()=>{if(!e.isConnected)return;const p=Math.min(1,(performance.now()-t0)/ms);e.textContent=String(Math.round(from+(to-from)*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(step);else e.textContent=String(to);};requestAnimationFrame(step);}
/* 11/16 作りこみ：タイルを左上から敷く。場所の行＋列の順に少しずつ遅らせて、小さい所からぱっと置く。画面の外のものは動かさない・遅れは0.4秒まで */
function tilesIn(box,sel){
  if(RM()||!box)return;const items=[...box.querySelectorAll(sel)];if(!items.length)return;
  const rs=items.map(e=>e.getBoundingClientRect()),tops=[...new Set(rs.map(r=>Math.round(r.top)))].sort((a,b)=>a-b),lefts=[...new Set(rs.map(r=>Math.round(r.left)))].sort((a,b)=>a-b);
  items.forEach((e,k)=>{const r=rs[k];if(r.height<1||r.top>innerHeight+20)return;
    e.style.setProperty('--d',Math.min(0.4,(tops.indexOf(Math.round(r.top))+lefts.indexOf(Math.round(r.left)))*0.04)+'s');fxRestart(e,'fxtile');});
}

const stage=$('stage'),cv=$('game'),ctx=cv.getContext('2d'),overlay=$('overlay'),banner=$('banner');

const xpNeed=lv=>Math.round(6+lv*4+lv*lv*0.6);
/* 威力の倍率：火力アップ・機体・怒りの回路（HP半分以下で最大） */
const dmgMul=()=>(1+0.1*R.pas.power)*R.sh.pow*(R.cs.berserk?1+R.cs.berserk*clamp((1-R.hp/R.maxHp)*2,0,1):1)*(1+0.3*R.focus)*R.fm*R.cs.pow;/* focus スナイパーの集中・fm ヴァンガードの前向き・cs.pow 研究所とガラスの大砲 */
/* ---------- 共通の数字（全部の武器と機体に効く）。装備の数から作る。機体の強化（#12）もここに足す ----------
   crit 会心の確率・critD 会心の倍率・area 範囲・dur 効果時間・multi 弾の数・mdmg 多弾の威力・range 射程・bspd 弾の速さ・rate 連射
   xp 経験値・gauge 必殺ゲージ・ifr 無敵時間・evade 回避・absorb 吸収板・berserk 怒りの回路 */
function calcCS(){
  const c=t=>R.mods.reduce((n,m)=>n+(m.t===t?1:0),0);
  const sh=R.sh;/* 機体の倍率（#11）：range スナイパー・area ボマー・evade ファントム（オメガは全部＋10%） */
  const P=R.pas,L=R.lab||{},X=R.spc||{},lb=k=>L[k]||0;/* #12：P 機体の強化（道中）・L 研究所・X 特別な強化 */
  R.cs={crit:0.05*c('crit')+0.04*P.critc,critD:2+0.2*P.critd,area:(1+0.15*c('amp'))*(sh.area||1)*(1+0.1*P.area),dur:(1+0.2*c('dur'))*(1+0.12*P.dur),
    multi:c('multi')+P.multi,mdmg:Math.pow(0.9,c('multi')),
    range:(1+0.15*c('scope'))*(sh.range||1)*(1+0.1*P.range),bspd:(1+0.15*c('scope'))*(1+0.12*P.bspd),
    rate:(1+0.08*c('cooler'))*(1+0.03*lb('r_rate'))*(X.wall?0.85:1),
    xp:(1+0.1*c('xpamp'))*(1+0.05*lb('r_xp'))*(X.greed?1.4:1)*(X.haste?1.3:1),gauge:(1+0.2*c('reactor'))*(1+0.12*P.skillg),
    ifr:(1+0.4*c('iframe'))*(1+0.15*P.iframe),evade:Math.min(0.6,Math.min(0.45,0.15*c('evade'))+(sh.evade||0)+0.04*P.evade),absorb:0.5*c('absorber'),berserk:0.3*c('berserk'),
    spike:c('spike'),frost:c('frost'),cdrone:c('cdrone'),
    knock:1+0.25*P.knock,exec:EXEC[P.exec]||0,pow:(1+0.04*lb('r_pow'))*(X.glass?1.5:1),spd:(1+0.03*lb('r_spd'))*(X.heavy?0.8:1)*(X.haste?1.15:1),
    mag:1+0.08*lb('r_mag'),goldM:(1+0.05*lb('r_gold'))*(X.greed?1.4:1),regen:0.1*lb('r_regen'),dmgIn:X.wall?0.7:1,eSpd:X.haste?1.15:1,spawn:X.greed?1.2:1,
    top:X.one?topWeapon():null};
}
/* 一点集中：いちばんレベルの高い武器（同じなら先につけた方） */
function topWeapon(){let best=null,bl=0;for(const m of R.mods){if(MODS[m.t].passive)continue;const l=R.tlv[m.t]||0;if(l>bl){bl=l;best=m.t;}}return best;}
/* 背水の陣：HPが減るほど速さと連射＋（最大40%） */
const backK=()=>R.spc.back?1+0.4*clamp(1-R.hp/R.maxHp,0,1):1;
/* 共通の数字がどの値に効くか：a 範囲・u 効果時間・g 射程・s 弾の速さ（かけ算）／n 弾の数（足し算） */
const CSK={
  laser:{n:'n',s:'spd'},gatling:{n:'n',s:'spd'},mine:{n:'n',a:'rad',u:'life'},shotgun:{n:'n',s:'spd',g:'life'},
  freeze:{n:'n',s:'spd',u:'slowT'},missile:{n:'n',a:'rad',g:'life'},flame:{n:'n',g:'life'},sword:{a:'range'},
  saw:{n:'n',a:'r',g:'v0'},thunder:{n:'chain',g:'range'},gravity:{a:'r',u:'life'},cannon:{a:'w',g:'len'},
  pulse:{n:'n',s:'spd'},rail:{n:'n',s:'spd'},sniper:{n:'n'},fan:{n:'n',s:'spd',g:'life'},ricochet:{n:'n',s:'spd'},
  splitter:{n:'n',s:'spd'},needle:{n:'n',s:'spd'},acid:{n:'n',a:'r',u:'life',s:'spd'},grenade:{n:'n',a:'rad',g:'dist'},
  cluster:{n:'k',a:['rad','srad'],g:'dist'},napalm:{n:'n',a:'r',u:'life',g:'run'},shockwave:{n:'n',a:'R'},torpedo:{n:'n',a:'rad'},
  plasma:{n:'n',a:'r'},prism:{n:'n',s:'spd'},halo:{n:'n',a:'R'},hlaser:{n:'n',g:'life'},sonic:{a:'R',u:'slowT'},
  gsword:{a:'range'},twin:{a:'range'},lance:{a:'len'},hammer:{a:'rad'},whip:{a:'len'},chainsaw:{a:'len'},scythe:{a:'R'},
  turret:{u:'life',g:'range'},minefield:{n:'n',a:'rad',u:'life'},satellite:{n:'n',g:'range'},micro:{n:'n',a:'rad'},emp:{a:'R'},
};
function csMul(s,key,v){if(!key||v===1)return;if(typeof key==='string'){if(s[key]!=null)s[key]*=v;}else for(const q of key)if(s[q]!=null)s[q]*=v;}
function applyCS(k,s){const cs=R.cs;csMul(s,k.a,cs.area);csMul(s,k.u,cs.dur);csMul(s,k.g,cs.range);csMul(s,k.s,cs.bspd);if(k.n&&s[k.n]!=null)s[k.n]+=cs.multi;}

/* spawning */

/* ステージごとの敵のまざり方（#13）。ステージ5は全部のステージの敵＋まぼろし（はじめの1分で少しずつふえる） */
const PICK=[null,
  t=>{const r=Math.random();if(t>=70&&r<0.1)return 'shooter';if(t>=35&&r<0.1+Math.min(0.12,(t-35)/400))return 'tank';return 'bug';},
  t=>{const r=Math.random();if(t>=15&&r<0.15)return 'hider';if(t>=40&&r<0.26)return 'charger';if(t>=90&&r<0.33)return 'tank';return 'bug';},
  t=>{const r=Math.random();if(t>=15&&r<0.1)return 'frost';if(t>=35&&r<0.22)return 'splitter';if(t>=100&&r<0.27)return 'shooter';return r<0.7?'shard':'bug';},
  t=>{const r=Math.random();if(t>=20&&r<0.1)return 'guard';if(t>=70&&r<0.18)return 'tank';if(t>=110&&r<0.25)return 'shooter';return 'bug';},
  t=>{const r=Math.random()/Math.min(1,0.35+t/90);if(r<0.08)return 'warp';if(r<0.13)return 'charger';if(r<0.18)return 'frost';if(r<0.23)return 'guard';if(r<0.28)return 'splitter';
    if(r<0.32)return 'hider';if(r<0.36)return 'tank';if(r<0.4)return 'shooter';return Math.random()<0.6?'bug':'shard';},
];

    spd:k.spd+(kind==='bug'?Math.min(25,R.t/11)*U:0),flash:0,dead:false,fire:rand(1.2,2.4),stopY:rand(GH*0.12,GH*0.38),shield:-9,refl:-9,slow:0,slowF:1,vul:0,son:0,sonV:0,stun:0,reapNow:false,spk:-9,sawT:-9,frz:-9,zn:0,zd:0,born:R.t,hn:R.hurtN,gsT:-9,

function wave(){const k=R.stg===3?'shard':'bug';for(let row=0;row<2;row++)for(let i=0;i<14;i++)addEnemy(R.stg===5&&row?'shard':k,21+i*(GW-42)/13,-24-row*24);showBanner('敵の群れが来る！');}
function spawn(dt){

  if(R.E.length<MAXE){R.acc+=spawnRate(Math.min(R.t,RUN_LEN))*dt*R.cs.spawn*fb;while(R.acc>=1){R.acc-=1;spawnOne();}}else R.acc=0;

  if(R.bossAt.length&&R.t>=R.bossAt[0]){R.bossAt.shift();const art=(R.bossArt&&R.bossArt.length?R.bossArt.shift():null)||(R.bossN%2?'boss2':'boss');R.bossN++;addBig(art);}

/* spatial grid */
function buildGrid(){
  const c=Math.ceil((GW+PADG*2)/CELL),r=Math.ceil((GH+PADG*2)/CELL);
  if(!grid||c!==gCols||r!==gRows){gCols=c;gRows=r;grid=Array.from({length:c*r},()=>[]);}
  else for(let i=0;i<grid.length;i++)grid[i].length=0;
  gMaxR=33;
  for(const e of R.E){if(e.dead||e.hide)continue;if(e.r>gMaxR)gMaxR=e.r;
    const cx=clamp(Math.floor((e.x+PADG)/CELL),0,gCols-1),cy=clamp(Math.floor((e.y+PADG)/CELL),0,gRows-1);
    grid[cy*gCols+cx].push(e);}
}
function near(x,y,r,fn){ATK++;
  const rr=r+gMaxR+2;/* 大型の敵（当たり54）もとらえる */
  const x0=clamp(Math.floor((x-rr+PADG)/CELL),0,gCols-1),x1=clamp(Math.floor((x+rr+PADG)/CELL),0,gCols-1);
  const y0=clamp(Math.floor((y-rr+PADG)/CELL),0,gRows-1),y1=clamp(Math.floor((y+rr+PADG)/CELL),0,gRows-1);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const cell=grid[cy*gCols+cx];
    for(let i=0;i<cell.length;i++){const e=cell[i];if(e.dead)continue;if(fn(e)===true)return;}}
}

function hit(e,amt,kx,ky){
  if(e.dead||e.hide)return;/* まぼろしが消えている間は当たらない */
  if(e.link){e.flash=0.07;e=e.link;if(e.dead)return;}/* 大蛇の体：頭の体力がへる */
  if(e.segs&&!LKB){if(e.lkT===R.t&&e.lkA===amt&&e.lkK===ATK)return;e.lkT=R.t;e.lkA=amt;e.lkK=ATK;}/* 大蛇：同じフレームの同じ攻撃（ビーム・範囲）は1回だけ。別の武器は攻撃の番号でわける（#14 の点検）。体は頭と同じ id なので、当たり済みの印も1つ（#13 の点検） */
  amt*=1+e.vul+(e.son>0?e.sonV:0);/* ニードル砲の「もろさ」・音波砲 */
  if(e.shell)amt*=0.3;/* 岩やどり：岩をかぶっている間は30% */
  if(e.kind==='guard'){const kl=Math.hypot(kx,ky);if(kl>1e-3&&(kx*Math.cos(e.fa)+ky*Math.sin(e.fa))/kl<-0.35){amt*=0.3;/* 盾持ち：前からは30% */
    if(Math.random()<0.25)spark(e.x+Math.cos(e.fa)*15,e.y+Math.sin(e.fa)*15,'#ffe0a8','y');SFX.play('block');}}
  if(R.cs.crit>0&&Math.random()<R.cs.crit){amt*=R.cs.critD;spark(e.x,e.y-e.r*0.5,'#fff2a8','y');}/* 会心 */
  e.hp-=amt;e.flash=0.07;SFX.play('hit');
  const kb=KIND[e.kind].kb,res=(kb!=null?kb:1)*R.cs.knock;e.kx+=kx*res;e.ky+=ky*res;
  if(e.hp<=0){e.dead=true;killed(e);}
  else if(R.cs.exec>0&&e.kind!=='boss'&&e.hp<=e.max*R.cs.exec){e.hp=0;e.dead=true;killed(e);}/* とどめ（#12）：小さい敵は体力が線より下で一撃 */
}
function blast(x,y,rad,dmg,kb,cols){let n=0;
  near(x,y,rad,e=>{const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy)||1;if(d<=rad+e.r){hit(e,dmg,dx/d*kb,dy/d*kb);n++;}});
  if(R.sh.bomb)ebClear(x,y,rad,'#ffe0b0',true);/* ボマーの爆風：小さい敵の弾も消える */
  ring(x,y,rad,cols);return n;
}
function addGem(x,y,v,big,vx,vy){if(R.G.length>320){gainXp(v);return;}R.G.push({x,y,v,big,vx:vx||0,vy:vy||0,dead:false,pull:false,sp:70*U});}
/* 最終ボスをたおした：敵と弾が消え、2.6秒の爆発のあとクリア */
function winStart(e){R.winT=2.6;R.winX=e.x;R.winY=e.y;R.inv=3;for(const o of R.E)if(!o.dead&&o!==e){o.dead=true;addX(o.x,o.y,EXPL.m,0.5);}for(const b of R.EB)b.dead=true;R.LZ.length=0;
  showBanner('深淵の核をたおした！');SFX.play('bossin2');}
function killed(e){
  const k=KIND[e.kind];
  if(k.trap){rockBreak(e,true);return;}/* 岩：お金だけ（撃破・経験値には数えない） */
  R.kills++;
  if(HSRC)R.meleeK++;gaugeAdd(SPG.kill[e.kind]||0);
  if(e.kind==='boss'&&R.t-e.born<=30)R.fastBoss++;
  const ak=e.art||e.kind;R.kE[ak]=(R.kE[ak]||0)+1;R.seenE[ak]=1;
  if(e.kind==='boss'){R.CH.push({x:clamp(e.x,30,GW-30),y:e.y,vy:-60,t:0,dead:false,pull:false,sp:70*U});if(R.hurtN===e.hn)R.nodmg=(R.nodmg||0)+1;}/* #12：宝箱・ノーダメージ */
  if(e.kind==='boss'){for(let i=0;i<10;i++)addGem(e.x+rand(-30,30),e.y+rand(-20,20),3,true,rand(-68,68),rand(-68,27));R.bossKills++;showBanner('大型の敵をたおした');SFX.play('boss');
    addX(e.x,e.y,EXPL.b,0.8);for(let i=0;i<5;i++)addX(e.x+rand(-60,60),e.y+rand(-45,45),EXPL.m,rand(0.4,0.7));}
  else{SFX.play('kill');addGem(e.x,e.y,k.xp*(e.reapNow?1.2:1),k.xp>=3);/* 大鎌で倒すと経験値＋20% */addX(e.x,e.y,k.xp<=1?EXPL.s:EXPL.m,k.xp<=1?0.36:0.5);}
  burst(e.x,e.y,k.burst||8,k.col);
  if(e.kind==='splitter'){SFX.play('split');for(const s of [-1,1]){const c=addEnemy('shard',e.x+s*9,e.y);c.kx=s*110*U;c.ky=-30*U;}}/* 割れ氷：2つに分かれる */
  if(e.segs)for(const s of e.segs){if(s.dead)continue;s.dead=true;addX(s.x,s.y,EXPL.m,rand(0.4,0.7));burst(s.x,s.y,10,k.col);}
  if(e.final)winStart(e);
  if(e.frz>R.t&&e.zn)zeroShards(e);/* 絶対零度で止めた敵：氷の破片 */
}
function hurt(d){
  if(R.inv>0)return;
  if(R.spInv>0)return;/* 必殺技の間の無敵（要塞バリア・突撃） */
  if(R.bar){R.bar=false;R.barCd=Math.max(5,14-3*(R.sup.barrier-1));R.inv=0.6;burst(R.x,R.y,14,['#c4ffe3','#5dffb0','#ffffff']);SFX.play('barrier');return;}
  if(R.cs.evade>0&&Math.random()<R.cs.evade){R.inv=0.25;R.dodge=0.3;burst(R.x,R.y,6,['#e0e8ff','#ffffff']);SFX.play('evade');return;}/* 回避装置 */
  d*=R.cs.dmgIn;R.hurtN++;/* 鉄壁（#12）・ノーダメージの記録 */
  R.hp=Math.max(0,R.hp-d);R.inv=0.55*R.cs.ifr;R.hurtFx=0.18;SFX.play('hurt');burst(R.x,R.y,10,['#ff2d6f','#ffffff']);
  if(R.sh.graze){R.ghost=0.8;R.inv=Math.max(R.inv,0.8);}/* ファントム：被弾すると0.8秒すがたを消す */
  if(R.cs.frost>0)frostNova();
  if(R.hp<=0&&R.guts){R.guts=false;R.hp=1;R.inv=1.2;showBanner('がんばり：HP1 でたえた');}
  if(R.hp<=0&&R.revLeft>0){R.revLeft--;R.hp=Math.round(R.maxHp*0.5);R.inv=2;R.hurtFx=0;reviveFx();showBanner('復活装置で HP50% にもどった');}
  if(R.hp<=0&&R.labRev>0){R.labRev--;R.hp=Math.round(R.maxHp*0.5);R.inv=2;R.hurtFx=0;reviveFx();showBanner('予備の機体で HP50% にもどった');}/* 研究所 */
  if(R.hp>0&&R.hp<R.maxHp*0.3&&R.ebLeft>0&&R.ebT<=0){R.ebLeft--;R.ebT=3;R.inv=Math.max(R.inv,3);SFX.play('ebar');}/* 緊急バリア */
  return true;/* 当たった（霜の弾の遅さに使う） */
}
function gainXp(v){R.xp+=v*(1+0.1*R.pas.xp)*R.cs.xp*(R.sh.xp||1);while(R.xp>=R.need){R.xp-=R.need;R.lv++;R.need=xpNeed(R.lv);R.pending++;}}

/* update steps */
function movePlayer(dt){
  if(R.sp&&R.sp.lock)return;/* ヴァンガードの突撃の間 */
  const ox=R.x,oy=R.y;movePlayer0(dt);
  if(R.sh.focus){const v=Math.hypot(R.x-ox,R.y-oy)/Math.max(dt,1e-4);R.focus=clamp(R.focus+(v<40*U?dt/1.5:-dt*3),0,1);}/* 集中：止まって1.5秒で最大 */
}
function movePlayer0(dt){
  const spd=185*U*R.sh.spd*(1+0.12*R.pas.speed+R.bonus.speed)*R.cs.spd*backK()*(R.chill>0?0.72:1)*(1-0.12*(R.snow||0));let kx=0,ky=0;/* 霜の弾・吹雪（#13） */
  if(keys.has('ArrowLeft')||keys.has('a'))kx-=1;if(keys.has('ArrowRight')||keys.has('d'))kx+=1;
  if(keys.has('ArrowUp')||keys.has('w'))ky-=1;if(keys.has('ArrowDown')||keys.has('s'))ky+=1;
  if(kx||ky){const l=Math.hypot(kx,ky);R.x+=kx/l*spd*dt;R.y+=ky/l*spd*dt;}
  else if(R.target){const dx=R.target.x-R.x,dy=R.target.y-R.y,d=Math.hypot(dx,dy),st=spd*1.25*dt;
    if(d<=st){R.x=R.target.x;R.y=R.target.y;}else{R.x+=dx/d*st;R.y+=dy/d*st;}}
  R.x=clamp(R.x,PMX,GW-PMX);R.y=clamp(R.y,PMY,GH-PMY);
}
const PMX=26,PMY=34;/* 自機が画面のはしで止まる位置 */
function shootAt(e,spd,off,big){spd*=U;const a=Math.atan2(R.y-e.y,R.x-e.x)+off,b={x:e.x,y:e.y+e.r*0.6,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg:8,big:!!big,dead:false};R.EB.push(b);return b;}
/* 決まった向きに撃つ・輪・扇（#13 の大型の敵） */
function ebAt(x,y,a,spd,big,slow){spd*=U;const b={x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg:big?10:8,big:!!big,dead:false};if(slow)b.slow=1;R.EB.push(b);return b;}
const aimA=(x,y)=>Math.atan2(R.y-y,R.x-x);
function ringAt(x,y,n,spd,off,big,slow){for(let i=0;i<n;i++)ebAt(x,y,off+i*TAU/n,spd,big,slow);}
function fanAt(x,y,n,gap,spd,big,slow){const a=aimA(x,y);for(let i=0;i<n;i++)ebAt(x,y,a+(i-(n-1)/2)*gap,spd,big,slow);}
function moveEnemies(dt){
  if(R.tstop>0){for(const e of R.E)if(e.flash>0)e.flash-=dt;return;}/* 時間停止（#12）：動かず撃たない */
  const damp=Math.pow(0.03,dt),lerp=Math.min(1,dt*3);
  for(const e of R.E){
    if(e.flash>0)e.flash-=dt;
    let sf=1;if(e.slow>0){sf=e.kind==='boss'?Math.max(0.6,e.slowF):e.slowF;e.slow-=dt;if(e.slow<=0)e.slowF=1;}
    if(e.son>0){e.son-=dt;if(e.son<=0)e.sonV=0;}
    if(e.stun>0){e.stun-=dt;sf=0;}/* 気絶・停止：動かず撃たない */
    if(e.frz>R.t)sf=0;/* 絶対零度：止まる */
    if(e.part)continue;/* 大蛇の体：あとで頭のあとにならべる */
    const dx=R.x-e.x,dy=R.y-e.y,d=Math.hypot(dx,dy)||1;let tx=0,ty=0;
    if(e.kind==='bug'){tx=dx/d*e.spd;ty=dy/d*e.spd;}
    else if(e.kind==='tank'){tx=dx/d*e.spd*0.6;ty=dy/d*e.spd*0.6+e.spd*0.5;}
    else if(e.kind==='shooter'){
      if(e.y<e.stopY)ty=e.spd*1.6;else{tx=Math.sin(R.t*1.3+e.id)*32*U;ty=7*U;}
      e.fire-=dt*sf;if(e.fire<=0&&e.y>0&&e.y<GH){e.fire=rand(2,3);shootAt(e,92,0);}
    }else if(e.kind==='boss'&&!(BIG[e.bt]&&BIG[e.bt].ai)){
      tx=clamp(dx*0.6,-e.spd*1.5,e.spd*1.5);ty=(GH*0.2-e.y)*0.8;
      e.fire-=dt*sf;if(e.fire<=0){e.fire=2.4;for(let k=-2;k<=2;k++)shootAt(e,85,k*0.28,true);}
    }else{TX=0;TY=0;(e.kind==='boss'?BIG[e.bt].ai:AI[e.kind])(e,dt,sf,dx,dy,d);tx=TX;ty=TY;}
    tx*=sf*R.cs.eSpd*R.snowK;ty*=sf*R.cs.eSpd*R.snowK;/* 時の加速（#12）・吹雪（#13） */
    e.vx+=(tx-e.vx)*lerp;e.vy+=(ty-e.vy)*lerp;e.kx*=damp;e.ky*=damp;if(e.stun>0||e.frz>R.t){e.vx=0;e.vy=0;}
    e.x+=(e.vx+e.kx)*dt;e.y+=(e.vy+e.ky)*dt;
    if(e.y>GH+105||e.y<-210||e.x<-150||e.x>GW+150)e.dead=true;
  }
  for(const e of R.E)if(e.segs&&!e.dead)segFollow(e);
}

/* ---------- ステージ2〜5の敵の動き（#13）。TX・TY に行きたい速さを入れる ---------- */
let TX=0,TY=0;
const ebFull=()=>R.EB.length>220;/* 敵の弾が多すぎるときは、小さい敵は撃たない（見やすさと重さ） */
const AI={
  /* 岩やどり：岩をかぶってゆっくり下りる → 近くで岩をすてて速く追う */
  hider(e,dt,sf,dx,dy,d){if(e.shell){TX=dx/d*e.spd*0.35;TY=e.spd*0.75;if(d<150||R.t-e.born>10){e.shell=0;e.sp=null;e.spd*=2.4;burst(e.x,e.y,10,ROCKC);SFX.play('crack');}}
    else{TX=dx/d*e.spd;TY=dy/d*e.spd;}},
  /* 角突き：下りる → 0.75秒止まってねらう（さいごの0.25秒は向きを変えない）→ まっすぐ突進 */
  charger(e,dt,sf,dx,dy,d){
    if(e.st===2){TX=e.ax*e.spd*7;TY=e.ay*e.spd*7;}
    else if(e.st===1){if(e.tm>0.25){e.ax=dx/d;e.ay=dy/d;e.sp=R8.charger[dir8(Math.atan2(dy,dx))];}e.tm-=dt*sf;if(e.tm<=0){e.st=2;SFX.play('dash');}}
    else{TX=dx/d*e.spd*0.3;TY=e.spd*1.5;if(e.y>=e.stopY){e.st=1;e.tm=0.75;}}},
  /* 霜の撃ち手：撃ち手と同じ動きで、遅くなる弾（2:30 から3つ） */
  frost(e,dt,sf){if(e.y<e.stopY)TY=e.spd*1.6;else{TX=Math.sin(R.t*1.1+e.id)*30*U;TY=6*U;}
    e.fire-=dt*sf;if(e.fire<=0&&e.y>0&&e.y<GH){e.fire=rand(2.6,3.4);if(ebFull())return;const n=R.t>=150?2:1;for(let k=0;k<n;k++)shootAt(e,80,(k-(n-1)/2)*0.3).slow=1;}},
  splitter(e,dt,sf,dx,dy,d){TX=dx/d*e.spd*0.8;TY=dy/d*e.spd*0.8+e.spd*0.3;},
  shard(e,dt,sf,dx,dy,d){TX=dx/d*e.spd;TY=dy/d*e.spd;},
  /* 砲台：床と流れる。砲身は自機へ少しずつ向き、3連の弾 */
  turret(e,dt,sf,dx,dy){TY=R.floorV||30;e.kx=0;e.ky=0;e.fa+=clamp(angDiff(Math.atan2(dy,dx),e.fa),-2*dt*sf,2*dt*sf);
    e.fire-=dt*sf;if(e.fire<=0&&e.y>10&&e.y<GH-40){e.fire=2.8;e.bn=3;e.bt2=0;}
    if(e.bn>0){e.bt2-=dt*sf;if(e.bt2<=0){e.bn--;e.bt2=0.14;if(!ebFull())ebAt(e.x+Math.cos(e.fa)*18,e.y+Math.sin(e.fa)*18,e.fa,88);}}},
  /* 盾持ち：ゆっくり近づき、盾を自機に向ける */
  guard(e,dt,sf,dx,dy,d){TX=dx/d*e.spd*0.7;TY=dy/d*e.spd*0.7+e.spd*0.25;e.fa+=clamp(angDiff(Math.atan2(dy,dx),e.fa),-1.4*dt*sf,1.4*dt*sf);e.sp=R8.guard[dir8(e.fa)];},
  /* まぼろし：近づく → ゆらぐ（0.4秒）→ 消える（0.6秒・出る所に印）→ あらわれて3発 */
  warp(e,dt,sf,dx,dy,d){e.tm-=dt*sf;
    if(e.st===0){TX=dx/d*e.spd*0.6;TY=dy/d*e.spd*0.6;if(e.tm<=0){e.st=1;e.tm=0.4;}}
    else if(e.st===1){if(e.tm<=0){e.st=2;e.tm=0.6;e.hide=1;const a=rand(0,TAU),r=rand(130,190);
      e.x=clamp(R.x+Math.cos(a)*r,30,GW-30);e.y=clamp(R.y+Math.sin(a)*r,40,GH-60);e.vx=e.vy=e.kx=e.ky=0;SFX.play('warp');}}
    else if(e.st===2){e.vx=e.vy=0;if(e.tm<=0){e.st=3;e.hide=0;e.tm=0.35;burst(e.x,e.y,8,KIND.warp.col);}}
    else if(e.tm<=0){e.st=0;e.tm=rand(2.4,3.2);if(!ebFull())for(let k=-1;k<=1;k++)shootAt(e,82,k*0.25);}},
  rock(e){TX=e.v0x;TY=e.v0y;},
  seg(){},
};
/* 大蛇の体：頭の通った道にならべる（頭から26ドットごと）。体の体力は頭と同じに見せる */
function segFollow(h){const T=h.trail,last=T[T.length-1];
  if(!last||Math.hypot(h.x-last[0],h.y-last[1])>=3){T.push([h.x,h.y]);if(T.length>200)T.shift();}
  h.segs.forEach((s,i)=>{const k=Math.max(0,T.length-1-Math.round((i+1)*26/3)),q=T[k];s.x=q[0];s.y=q[1];s.hp=h.hp;s.max=h.max;s.vx=s.vy=0;});}
/* 大型の敵の動きの共通：上の方にとどまり、自機の横に少しついてくる */
function hover(e,y,k){TX=clamp((R.x-e.x)*k,-e.spd*1.5,e.spd*1.5);TY=(y-e.y)*0.8;}

    if(e.st===1){e.q-=dt*sf;e.sa+=2.1*dt*sf;if(e.q<=0){e.q=0.12;for(let i=0;i<3;i++)ebAt(e.x,e.y+6,e.sa+i*TAU/3,78,false);}}
    if(e.tm<=0){e.st=(e.st+1)%4;
      if(e.st===1)e.tm=2.4;
      else if(e.st===2){e.tm=0.6;}

/* 投げた弾・魚雷・プラズマ球・ナパーム */

/* 追尾レーザー・砲台・衛星 */

        else s.cd=0.2;}});
  }
  for(const t of R.TR){t.t+=dt;if(t.t>t.dur)t.dead=true;}
}

/* 盾ドローン・前面シールド・守護の大剣の盾・緊急バリア */
function shields10(dt){
  let si=0;

    if(m.t==='sdrone'){const st=stat('sdrone'),orb=st.orb+si*12;si++;m.sa=(m.sa==null?m.slot*1.3:m.sa)+dt*st.w;
      if(!m.sp)m.sp=[];m.sp.length=st.n;
      for(let i=0;i<st.n;i++){const a=m.sa+i*TAU/st.n,p=m.sp[i]||(m.sp[i]={});p.x=R.x+Math.cos(a)*orb;p.y=R.y+Math.sin(a)*orb*0.92;p.r=st.r;p.l8=st.l8;
        for(const b of R.EB){if(b.dead)continue;const dx=b.x-p.x,dy=b.y-p.y,rr=st.r+(b.big?8:5);if(dx*dx+dy*dy<=rr*rr){ebGone(b,'#d2ffe8','g');SFX.play('shield');}}}}

      const a=dirAngle(m.d),lo=(st.R-14)**2,hi=(st.R+6)**2;

        if(Math.abs(angDiff(Math.atan2(dy,dx),a))>st.half)continue;

        if(m.fh<=0){m.fr=st.regen;burst(R.x+Math.cos(a)*st.R,R.y+Math.sin(a)*st.R,14,['#ffffff','#8cf0c8','#18b0b4']);SFX.play('fsbreak');break;}}}
    else if(m.t==='gsword'&&R.evo.gsword&&m.gsh>0){m.ga=(m.ga||0)+dt*2.2;if(!m.gp)m.gp=[];m.gp.length=m.gsh;

  }

/* 回収ドローン：経験値の玉とお金を拾いに行き、機体へ送る（1つにつき1機） */
function drones10(dt){
  while(R.CD.length<R.cs.cdrone)R.CD.push({x:R.x,y:R.y,tg:null,rt:R.CD.length*0.1,a:R.CD.length*2.1});
  for(const d of R.CD){

    let tx,ty,sp;

    const dx=tx-d.x,dy=ty-d.y,dd=Math.hypot(dx,dy)||1,st=Math.min(dd,sp*dt);d.x+=dx/dd*st;d.y+=dy/dd*st;

function pickLoot(d){let best=null,bd=(300*U)**2;
  const look=(arr,w)=>{for(const g of arr){if(g.dead||g.pull||g.y<0||g.y>GH)continue;let taken=false;for(const o of R.CD)if(o!==d&&o.tg===g){taken=true;break;}if(taken)continue;
    const v=((g.x-d.x)**2+(g.y-d.y)**2)*w;if(v<bd){bd=v;best=g;}}};
  look(R.C,0.4);look(R.G,1);return best;}
/* 進化した武器のうち、ずっと動くもの：永久ノコ・蒼い業火の渦・小さな太陽 */
function evo10(dt){
  for(const m of R.mods){
    if(!R.evo[m.t])continue;

function upPool(skip){
  const W=[],P=[],S=[];
  TYPES.forEach(t=>{const lv=R.tlv[t],m=MODS[t],key='w:'+t;if(lv>0&&lv<WMAX&&!R.ban.has(key)&&!skip.has(key))

  Object.keys(PAS).forEach(k=>{const p=PAS[k],lv=R.pas[k],key='p:'+k;if(lv>=p.max||R.ban.has(key)||skip.has(key))return;
    P.push({key,cat:'p',icon:{img:PICON[k]},name:p.name,tag:'機体',lv,max:p.max,desc:p.at?p.at[lv]:p.desc,
      fn:()=>{R.pas[k]++;if(k==='armor'){R.maxHp+=20;R.hp=Math.min(R.maxHp,R.hp+20);}}});});
  Object.keys(SUP).forEach(k=>{const s=SUP[k],lv=R.sup[k],key='s:'+k;if(lv>=s.max||R.ban.has(key)||skip.has(key))return;
    const desc=s.at?s.at[lv]:lv===0?s.first:(lv+1===s.max&&s.last)?s.last:s.more;
    S.push({key,cat:'s',w:lv===0?1.2:1,icon:SICON[k]?{img:SICON[k]}:{ch:s.ic},name:s.name,tag:'支援',lv,max:s.max,desc,fn:()=>supUp(k)});});
  const sh=R.sh.carrier?[0.35,0.2,0.45]:[0.45,0.3,0.25],out=[];
  [[W,sh[0]],[P,sh[1]],[S,sh[2]]].forEach(([L,share])=>{let tw=0;L.forEach(o=>{tw+=o.w||1;});L.forEach(o=>{o.w=share*(o.w||1)/tw;out.push(o);});});
  return out;
}

function buildChoices(skip){
  skip=skip||new Set();const pool=upPool(skip),out=[],ev=evoReady().filter(t=>!skip.has('e:'+t));
  if(ev.length)out.push(evoChoice(ev[0]));/* 進化は最初の枠 */
  while(out.length<3&&pool.length)out.push(fixC(drawW(pool)));
  /* 特別な強化：レベル5から 15% で、最後の枠が特別になる（1出撃にそれぞれ1回） */
  if(R.lv>=5&&Math.random()<0.15){const xs=SPC_IDS.filter(k=>!R.spc[k]&&!R.ban.has('x:'+k)&&!skip.has('x:'+k));

  const keep=R;R={t:S.t,neb:S.neb,pl:S.pl,stars:S.stars};
  const gh=GH;GH=h;drawBg(g);GH=gh;R=keep;
  for(const b of S.shots){for(let k=6;k>=0;k--){g.fillStyle=k<2?'#ffffff':k<4?'#4adcf6':'#168fb8';g.fillRect(b.x-1,Math.round(b.y+k*2)-1,3,3);}}
  const sp=SHIPSPR[save.cur],fl=sp.fl[((S.t*14)|0)%sp.fl.length];
  g.drawImage(fl,px-sp.cx,py-sp.cy);g.drawImage(sp.img,px-sp.cx,py-sp.cy);
}
/* 11/16 作りこみ：画面の切りかえ（ドットの四角が斜めに小さくなって、新しい画面が出てくる）。切りかえそのものはすぐ（操作を待たせない）。
   キャンバスの1点＝画面の8px・6点のマス。前の端は少し明るい色 */
const wipeCv=document.createElement('canvas');wipeCv.id='wipe';wipeCv.setAttribute('aria-hidden','true');document.body.appendChild(wipeCv);
let wipeRaf=0;
function pixWipe(ms){
  if(RM())return;ms=ms||380;
  const cell=8,B=6,cw=Math.ceil(innerWidth/cell),ch=Math.ceil(innerHeight/cell);
  wipeCv.width=cw;wipeCv.height=ch;wipeCv.style.display='block';
  const g=wipeCv.getContext('2d'),cols=Math.ceil(cw/B),rows=Math.ceil(ch/B),span=Math.max(1,cols+rows-2),t0=performance.now();
  cancelAnimationFrame(wipeRaf);
  const step=()=>{const t=(performance.now()-t0)/ms;g.clearRect(0,0,cw,ch);
    if(t>=1){wipeCv.style.display='none';return;}
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const p=Math.min(1,Math.max(0,(t-(c+r)/span*0.55)/0.45));if(p>=1)continue;
      const sz=Math.round((1-p)*B);if(sz<=0)continue;const o=(B-sz)>>1;g.fillStyle=p>0.05&&p<0.4?'#2e3277':'#080a1c';g.fillRect(c*B+o,r*B+o,sz,sz);}
    wipeRaf=requestAnimationFrame(step);};
  step();
}
function showTitle(){pixWipe();
  hangar.hidden=true;sortie.hidden=true;$('howto').hidden=true;titleEl.hidden=false;
  titleBg();renderSnd();if(!tRaf){tLast=performance.now();tRaf=requestAnimationFrame(titleFrame);}
}
function toHangarFromTitle(){pixWipe();titleEl.hidden=true;$('howto').hidden=true;hangar.hidden=false;tutReset();view=save.cur;layoutEditor();const got=checkAch();renderAll();if(got.length)toast(got.length>2?'実績を'+got.length+'個達成 ＋'+got.reduce((n,x)=>n+x.g,0)+'G':achText(got));}
function renderSnd(){const b=$('sndBtn');b.textContent=save.snd===false?'音 OFF':'音 ON';b.setAttribute('aria-pressed',save.snd===false?'false':'true');}
$('sndBtn').addEventListener('click',()=>{save.snd=save.snd===false;persist();renderSnd();SFX.unlock();SFX.play('btn');});

/* 遊び方（絵つき4枚・1回目のスタートのときにも出す） */
const HOWTO=[
  {t:'指でなぞって動く'},
  {t:'撃つのは自動'},
  {t:'レベルアップで強くなる'},
  {t:'お金で買って組み合わせる'},
];
let howPage=0,howFirst=false;
function howArt(i){
  const c=document.createElement('canvas');c.width=160;c.height=110;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  g.fillStyle='#05060f';g.fillRect(0,0,160,110);g.drawImage(NEB,0,200,160,110,0,0,160,110);
  const sp=SHIPSPR.standard,DS2=(s,x,y)=>g.drawImage(s.img||s,Math.round(x-(s.w||s.width)/2),Math.round(y-(s.h||s.height)/2));
  const sh=(x,y,k)=>{g.save();g.translate(x,y);g.scale(k,k);g.drawImage(sp.fl[0],-sp.cx,-sp.cy);g.drawImage(sp.img,-sp.cx,-sp.cy);g.restore();};
  if(i===0){sh(64,60,0.75);g.drawImage(FINGER.img,118,64,24,30);}
  if(i===1){sh(80,82,0.62);DS2(ESPR.bug,50,22);DS2(ESPR.bug,110,16);DS2(ESPR.shooter,82,20);
    for(const x of [70,90])for(let y=40;y<64;y+=9){g.fillStyle='#4adcf6';g.fillRect(x,y,3,6);g.fillStyle='#fff';g.fillRect(x+1,y,1,2);}}
  if(i===2){[[40,50],[60,64],[50,82],[76,44]].forEach(([x,y])=>DS2(GEMS,x,y));DS2(GEMB,70,78);
    g.fillStyle='#14163a';g.fillRect(96,20,56,72);g.strokeStyle='#2e3277';g.lineWidth=2;g.strokeRect(97,21,54,70);
    g.fillStyle='#5aa2ff';for(let k=0;k<3;k++){g.fillRect(104,32+k*20,10,10);g.fillStyle=k?'#2e3277':'#ffd23f';g.fillRect(118,35+k*20,26,4);g.fillStyle='#5aa2ff';}}
  if(i===3){sh(52,58,0.7);DS2(MISC.coin,110,22);DS2(MISC.coin,126,30);DS2(MISC.coin,98,32);
    DS2(MSPR.missile[0],104,66);DS2(MSPR.shield[0],132,66);DS2(MSPR.sword[1],118,92);}
  return c;
}
function renderHowto(){
  const box=$('howCard'),p=HOWTO[howPage];box.textContent='';
  const art=howArt(howPage);art.className='howart';art.setAttribute('aria-hidden','true');
  box.append(el('p','howno num',(howPage+1)+' / '+HOWTO.length),art,el('h3',null,p.t));
  const dots=el('div','howdots');HOWTO.forEach((_,k)=>dots.appendChild(el('i',k===howPage?'on':null)));box.appendChild(dots);
  $('howPrev').disabled=howPage===0;
  $('howNext').textContent=howPage<HOWTO.length-1?'次へ':howFirst?'はじめる':'とじる';
}
function openHowto(first){howFirst=first;howPage=0;$('howto').hidden=false;renderHowto();}
$('howPrev').addEventListener('click',()=>{if(howPage>0){howPage--;renderHowto();}});
$('howNext').addEventListener('click',()=>{
  if(howPage<HOWTO.length-1){howPage++;renderHowto();return;}
  save.howto=1;persist();$('howto').hidden=true;if(howFirst)toHangarFromTitle();
});
/* 最初のタップで音を始める・ボタンの音 */
document.addEventListener('pointerdown',()=>SFX.unlock(),{capture:true});
document.addEventListener('click',e=>{SFX.unlock();const b=e.target.closest&&e.target.closest('button');if(!b||b.disabled)return;
  if(b.id==='startBtn'||b.id==='sndBtn'||b.classList.contains('buybig'))return;SFX.play('btn');},{capture:true});

document.querySelectorAll('.gname').forEach(e=>{e.textContent=GAME_NAME;});
layoutEditor();renderAll();showTitle();
setTimeout(warmLazy,300);/* 残りの絵は、出撃していない間に少しずつ作る（#14） */
})();
</script>
